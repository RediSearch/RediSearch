id: 463a457f-d2bb-4a24-ba11-7c6819312bd4
name: verify-asan
description: >-
  Reproduce a CI AddressSanitizer failure locally: build instrumented, then run
  the C and C++ unit tests and the Python suite against that build.

  This is a debugging tool, not a gate. Reach for it when the asan job has failed
  on a pull request and you need the failure in front of you; do not run it
  before opening one. CI already covers asan on every pull request, so running it
  locally in advance buys a second opinion at the price of a whole extra build —
  the sanitizer is its own flavor, `debug-asan`, so it cannot reuse the build
  every suite in `verify` shares.

  The Python step needs a redis-server built with the same sanitizer toolchain.
  An ordinary server dies as it loads the instrumented module, and every test
  then fails with a connection error that says nothing about the real cause. CI
  builds and ships a matching server; a local machine usually has not, which is
  the other reason this is not something to run speculatively.

  Narrow it. A CI failure names the test that failed, and cTestFilter or
  pytestFilter turn a full instrumented run into the one case you are chasing.
tags:
  purpose: verification
reports:
  require:
    - "@gdesmott/failure-digest"
inputs:
  type: object
  properties:
    force:
      type: boolean
      default: false
      description: >-
        Rebuild from scratch. The sanitizer build has its own flavor directory,
        so an incremental build is normally correct; force it when a previous
        sanitizer build was interrupted and left that directory half-written.
    cTestFilter:
      type: string
      default: ""
      description: >-
        Narrow the C and C++ unit tests to one binary or one gtest. Empty runs
        every block.
    pytestFilter:
      type: string
      default: ""
      description: >-
        Narrow the Python suite to a file or a single test. Empty runs
        everything.
    testTimeout:
      type: integer
      default: 600
      description: >-
        Per-test timeout for the Python suite, in seconds. Twice build.sh's
        default of 300, because sanitizer instrumentation makes every test
        slower and a test killed by the timeout reports as a failure rather than
        as the slowdown it is.
jobs:
  - name: asan
    description: Build instrumented, then run both suites against it
    concurrency: 1
    steps:
      - name: build
        description: Build the module and the test binaries with AddressSanitizer
        task:
          type: model_method
          modelIdOrName: build
          methodName: build
          inputs:
            sanitizer: address
            buildTests: true
            force: ${{ inputs.force }}
            extraArgs:
              - ENABLE_ASSERT=1
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: module-built
        description: >-
          This run produced an instrumented module, rather than leaving an
          earlier build's in place. A failed build does not remove the previous
          artifact, and an uninstrumented leftover would find nothing.
        task:
          type: assert
          expr: >-
            data.query('modelName == "build" && name == "summary" && version >= 0 && workflowRunId == "' + run.id + '"')[0].attributes.modulePath != null
            && !data.query('modelName == "build" && name == "summary" && version >= 0 && workflowRunId == "' + run.id + '"')[0].attributes.moduleStale
            && data.query('modelName == "build" && name == "summary" && version >= 0 && workflowRunId == "' + run.id + '"')[0].attributes.sanitizer == "address"
          message: >-
            No AddressSanitizer module was produced by this run in
            ${{ data.query('modelName == "build" && name == "summary" && version >= 0 && workflowRunId == "' + run.id + '"')[0].attributes.binDir }} — the
            artifact is missing, left over from an earlier build, or not
            instrumented.
          severity: high
        dependsOn:
          - step: build
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: c-unit-tests
        description: Run the C and C++ unit tests under AddressSanitizer
        task:
          type: model_method
          modelIdOrName: c-unit-tests
          methodName: run
          inputs:
            sanitizer: address
            skipBuild: true
            test: ${{ inputs.cTestFilter }}
        dependsOn:
          - step: module-built
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: c-unit-tests-complete
        description: >-
          Tests actually ran, and on an unfiltered run every block ran rather
          than being silently skipped because its binaries were missing.
        task:
          type: assert
          expr: >-
            data.query('modelName == "c-unit-tests" && name == "summary" && version >= 0 && workflowRunId == "' + run.id + '"')[0].attributes.summaryParsed
            && int(data.query('modelName == "c-unit-tests" && name == "summary" && version >= 0 && workflowRunId == "' + run.id + '"')[0].attributes.testsRun) > 0
            && (inputs.cTestFilter != ""
                || data.query('modelName == "c-unit-tests" && name == "summary" && version >= 0 && workflowRunId == "' + run.id + '"')[0].attributes.blocks.all(b, b.status != "skipped"))
          message: >-
            Unit test blocks were skipped or no tests ran — the instrumented test
            binaries were probably not built. Ran
            ${{ data.query('modelName == "c-unit-tests" && name == "summary" && version >= 0 && workflowRunId == "' + run.id + '"')[0].attributes.testsRun }} tests.
          severity: high
        dependsOn:
          - step: c-unit-tests
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: pytest
        description: Run the Python suite against the instrumented module
        task:
          type: model_method
          modelIdOrName: pytest
          methodName: run
          inputs:
            sanitizer: address
            skipBuild: true
            testTimeout: ${{ inputs.testTimeout }}
            test: ${{ inputs.pytestFilter }}
        dependsOn:
          - step: c-unit-tests-complete
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: pytest-ran
        description: >-
          The suite actually executed tests. Without a sanitizer-built
          redis-server every test fails as the server dies loading the module,
          so a run that tested nothing is the signal that the server is wrong
          rather than the code.
        task:
          type: assert
          expr: >-
            data.query('modelName == "pytest" && name == "summary" && version >= 0 && workflowRunId == "' + run.id + '"')[0].attributes.summaryParsed
            && int(data.query('modelName == "pytest" && name == "summary" && version >= 0 && workflowRunId == "' + run.id + '"')[0].attributes.testsRun) > 0
          message: >-
            The Python suite ran no test under AddressSanitizer. The most likely
            cause is a redis-server that was not built with the same sanitizer
            toolchain, which dies as it loads the instrumented module.
          severity: high
        dependsOn:
          - step: pytest
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
