                 && (inputs.coordinator || (data.query('modelName == "task-implementer" && name == "implementation" && version >= 0 && attributes.agent.executedAt < "' + run.startedAt + '"' + (inputs.implementationLabel == "" ? "" : ' && attributes.agent.label == "' + inputs.implementationLabel + '"'))[data.query('modelName == "task-implementer" && name == "implementation" && version >= 0 && attributes.agent.executedAt < "' + run.startedAt + '"' + (inputs.implementationLabel == "" ? "" : ' && attributes.agent.label == "' + inputs.implementationLabel + '"')).size() - 1].attributes.filesChanged.exists(f, f.startsWith("src/coord/")) || data.query('modelName == "task-implementer" && name == "implementation" && version >= 0 && attributes.agent.executedAt < "' + run.startedAt + '"' + (inputs.implementationLabel == "" ? "" : ' && attributes.agent.label == "' + inputs.implementationLabel + '"'))[data.query('modelName == "task-implementer" && name == "implementation" && version >= 0 && attributes.agent.executedAt < "' + run.startedAt + '"' + (inputs.implementationLabel == "" ? "" : ' && attributes.agent.label == "' + inputs.implementationLabel + '"')).size() - 1].attributes.agent.?pathsTouched.orValue([]).exists(f, f.startsWith("src/coord/"))) || data.query('modelName == "code-reviser" && name == "revision" && version >= 0').filter(v, v.attributes.agent.label == data.query('modelName == "task-implementer" && name == "implementation" && version >= 0 && attributes.agent.executedAt < "' + run.startedAt + '"' + (inputs.implementationLabel == "" ? "" : ' && attributes.agent.label == "' + inputs.implementationLabel + '"'))[data.query('modelName == "task-implementer" && name == "implementation" && version >= 0 && attributes.agent.executedAt < "' + run.startedAt + '"' + (inputs.implementationLabel == "" ? "" : ' && attributes.agent.label == "' + inputs.implementationLabel + '"')).size() - 1].attributes.agent.label).exists(v, (v.attributes.?filesChanged.orValue([]).exists(f, f.starts