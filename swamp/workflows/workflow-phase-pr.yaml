      - name: ready-to-open
        description: >-
          The gate before anything leaves this machine.

          Everything up to here has been local and repeatable. Opening the pull
          request is neither, and the repository forbids rewriting the branch
          once it exists — so the history as it stands now is the history the
          pull request keeps.
        task:
          type: manual_approval
          prompt: >-
            About to open a pull request. This is the first step that is visible
            outside this machine, and the branch cannot be rewritten afterwards.

            Check the commits are the shape you want them reviewed in — this is
            the last moment they can be reorganised. Reorganising is fine:
            splitting, reordering and rewording all keep the content, and the
            content is what the next step checks. Changing it is not — an edit
            committed here is work the review never saw, and the hand-off
            refuses to run against a tree other than the reviewed one. If you
            need to change something, that is another pass through
            `phase-implement`.

            Leave nothing uncommitted either. The next step commits what it
            finds, so an edit or a stray file left here would be pushed without
            having been reviewed or validated — it refuses to start on a dirty
            checkout rather than let that happen.

            What was built:
              swamp data get task-implementer --json
            The review that cleared it:
              swamp data get code-reviewer --json

            Approve with:
              swamp workflow approve phase-pr ready-to-open
              swamp workflow resume  phase-pr
            Reject with:
