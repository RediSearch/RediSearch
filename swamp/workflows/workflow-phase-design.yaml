id: 84671653-6509-40f7-b7b3-d739e123527b
name: phase-design
description: >-
  Phases 1 and 2 of the implement-task skill: write the tests the change will be
  measured against, then design the change, reviewing both.

  Nothing is implemented here. That is the point of splitting it out — the
  expensive, hard-to-unpick part of a task is the code, and this workflow exists
  to get the tests and the design right before any of it is written.

  The approval gate is not in this workflow. It belongs between this phase and
  the implementation, and it lives in the `implement-task` parent, which calls
  this and then suspends — a gate here would be the last step of the run, which
  is to say after everything it could have stopped had already happened. Running
  this workflow on its own is still useful and still safe: it produces a design
  and stops, and nothing downstream starts until you start it.

  What the tests phase does depends on the task. A port is measured against the
  behaviour of the C it replaces, so the tests have to exist first; a bug fix
  needs a test that fails for the stated reason before there is a fix; a new
  feature has nothing to test yet, and the skill has its tests written with the
  code instead. So the tests phase is skipped outright for `feature` and runs
  for the other two.

  Both the tests and the design go through the review loop, and for the same
  reason: a test that passes for the wrong reason makes every gate after it
  meaningless while looking exactly like a test that works.

  Read what it produced with:

    swamp data get task-design-agent --json
    swamp data get design-reviewer --json
tags:
  purpose: implement-task
inputs:
  type: object
  properties:
    task:
      type: string
      description: >-
        What to do, in your own words — the module to port, the bug to fix, the
        feature to add. Every agent in every phase is given this unchanged.
    taskType:
      type: string
      enum: ["port", "bugfix", "feature"]
      default: port
      description: >-
        Which kind of task this is. It decides whether tests are written up
        front: `port` and `bugfix` write them first, `feature` skips the phase
        because there is nothing to write tests against yet.
    measureCoverage:
      type: boolean
      default: false
      description: >-
        Measure how well the Python suite covers the code being replaced, before
        writing tests. Off by default because it is the most expensive step in
        the flow — an instrumented build plus the whole suite, tens of minutes —
        not because it is optional to the skill, which asks for it on every port.
        Turn it on for a port you care about getting right; the files come from
        the analysis, so you do not have to name them.
    coverageFiles:
      type: array
      items:
        type: string
      default: []
      description: >-
        Override the files whose coverage is measured, as repository-relative
        paths, e.g. `["src/union_iterator.c"]`. Empty uses what the analysis
        phase found, which is the normal case — it read the code, and a path
        typed here from memory is one that can be wrong in front of a
        twenty-minute build. Use it when the analysis got the scope wrong, or to
        report on a file it did not list.
    reuseCoverageTrace:
      type: boolean
      default: false
      description: >-
        Report from the coverage trace already on disk instead of measuring
        again. Measuring costs an instrumented build plus the whole Python
        suite; re-reporting other files from the same trace costs milliseconds,
        so this is how you look at a second file after a first measurement.
        Requires `coverageTraceNotOlderThan`.
    coverageTraceNotOlderThan:
      type: string
      default: ""
      description: >-
        ISO 8601 timestamp the reused trace must be at or newer than — take the
        `capturedAt` of the coverage summary that measured it, which is that
        trace's own timestamp. Not its `executedAt`: a model stamps that when it
        finishes recording, which is *after* the trace was written, so passing it
        back rejects the very trace being reused. Required when
        `reuseCoverageTrace` is set, and deliberately not defaulted: a trace from
        an earlier build reports gaps for code that has since changed, and there
        is no safe default bound for that.
    blockingSeverities:
      type: array
      items:
        type: string
        # Closed, because a value outside it silently weakens the gate rather
        # than failing: the predicates ask `severity in blockingSeverities`, and
        # a misspelling of `critical` matches nothing, so every critical finding
        # reads as non-blocking and the loop settles on a review it should have
        # rejected. The vocabulary is the reviewer's own, which the model
        # enforces on the agent — this enforces the other half, on the caller.
        enum: ["critical", "high", "medium", "low"]
      default: ["critical", "high", "medium"]
      description: >-
        Which finding severities have to be gone before a review loop is done.
        Passed to every review loop this workflow runs. The default leaves `low`
        out: a reviewer that has run out of substantive findings reports smaller
        ones rather than none, and waiting for those to stop is how a loop spends
        its rounds on things nobody would hold the change for.
    label:
      type: string
      default: ""
      description: >-
        Stamped onto every record this phase's agents write, as `agent.label`,
        and left empty this run's own id is used.

        It is what lets a caller name the design *this* call produced. Time
        cannot: a caller that suspends at an approval gate holds the run open
        while another task finishes, and "the newest design" is then somebody
        else's — which matters most in the copyable command the gate prints,
        where the wrong path is one the operator pastes back as approved. The
        parent flow passes its own run id for exactly that reason.
    bugfixReproConfirmed:
      type: boolean
      default: false
      description: >-
        The bug-fix test still fails for the stated reason after the review
        changed it. Only needed when the tests review revised the tests: the
        repro quote belongs to the test as first written, and a review that
        replaced a false-positive test leaves that quote describing something
        that no longer exists. Set it once you have watched the final test fail.
    specApproved:
      type: boolean
      default: false
      description: >-
        The change has already been through the repository's spec-driven
        workflow — GitHub issue, proposal, design, tasks and spec delta, each
        reviewed by a maintainer. Only set this when that actually happened: it
        is the one thing that lets a design flagged as a large change past the
        gate, and the gate exists because nothing in this flow can stand in for
        maintainer review.
    agentModel:
      type: string
      default: ""
      description: >-
        Model to run the agents on. Empty inherits the CLI's own default.
    permissionMode:
      type: string
      default: auto
      description: >-
        Permission mode for the agents. `auto` matches an interactive session.
    timeout:
      type: integer
      default: 3600000
      description: Timeout for a single agent run, in milliseconds.
jobs:
  - name: design
    description: Tests first, then the design, each reviewed, then a gate
    # One agent at a time: they share the checkout, and two editing it at once
    # would interleave their changes.
    concurrency: 1
    steps:
      - name: analyze
        description: >-
          Work out what the task actually touches, before anything is measured
          or written.

          The skill puts this before Phase 1, and it is what scopes the phase:
          `port-c-module` §1 names the C files being replaced, the functions in
          them, what they depend on, and the tests that already cover them.
          Without it every later phase re-derives that from the task description
          on its own, and the coverage measurement has to be told which files to
          read by hand — which is a path typed from memory in front of a
          twenty-minute build.

          Read-only and cheap, and its answer is inspectable before anything
          expensive is spent on it. Skipped for a feature, which replaces nothing
          and so has nothing to analyse.
        guard: >-
          ${{ inputs.taskType == "feature" ? "skip" : "" }}
        task:
          type: model_method
          modelType: "@gdesmott/claude-task"
          modelName: task-analyst
          methodName: analyze
          globalArgs:
            # The agent works on the checkout, not on the swamp repository
            # directory this workflow lives in — one level up from it.
            workingDir: '..'
            model: ${{ inputs.agentModel }}
            permissionMode: ${{ inputs.permissionMode }}
            timeout: ${{ inputs.timeout }}
          inputs:
            label: >-
              ${{ inputs.label == "" ? run.id : inputs.label }}
            task: ${{ inputs.task }}
            instructions: >-
              This is a ${{ inputs.taskType }} task. Do not write or change
              anything: this phase only establishes scope.
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: measure-coverage
        description: >-
          Measure which lines of the C being replaced the Python suite never
          reaches, so the tests phase knows what is actually missing.

          For a port the tests are the invariant across the port, and "the C is
          covered" is a measurement rather than an opinion — whole files sit well
          below full coverage, so an agent left to judge for itself either writes
          far too many tests or declares the ground already covered. This runs
          the repository's own `flow-coverage`, whose report names the uncovered
          lines per file, and hands that to the tests phase.

          It runs only when you ask for it with `measureCoverage`, because it is
          the most expensive step in the flow: an instrumented build plus the
          whole Python suite, tens of minutes. Off, the tests phase works from
          the analysis and the task alone.

          The files come from the analysis phase rather than from you. That is
          the point of running the analysis first — it read the code to work out
          what the change replaces, and a hand-typed path is one that can be
          wrong in front of a twenty-minute build. `coverageFiles` overrides it
          when the analysis got the scope wrong.
        guard: >-
          ${{ !inputs.measureCoverage || inputs.reuseCoverageTrace || (size(inputs.coverageFiles) == 0 && data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() == 0) ? "skip" : "" }}
        task:
          type: workflow
          workflowIdOrName: flow-coverage
          inputs:
            files: >-
              ${{ size(inputs.coverageFiles) > 0 ? inputs.coverageFiles : data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.files }}
        dependsOn:
          - step: analyze
            condition:
              type: always
        weight: 0
        allowFailure: false

      - name: coverage-trace-bounded
        description: >-
          Reusing a trace means saying how new it has to be.

          The measurement is the expensive part and reporting from an existing
          trace is nearly free, which is what makes reuse worth having — and also
          what makes it dangerous: a trace left behind by an earlier build
          reports a complete-looking set of gaps belonging to code that has since
          changed. `coverageTraceNotOlderThan` is the bound that rules that out,
          and it is required rather than defaulted because no default is right
          for it. Take the timestamp from the run whose trace you mean to reuse.
        task:
          type: assert
          expr: >-
            !inputs.reuseCoverageTrace || inputs.coverageTraceNotOlderThan != ""
          message: >-
            reuseCoverageTrace is set but coverageTraceNotOlderThan is empty.
            Pass the `capturedAt` of the coverage summary whose trace you are
            reusing — that is the trace's own timestamp, and it is what the bound
            is compared against. Not its `executedAt`, which the model stamps
            after it has finished reading the trace and so rejects the very trace
            being reused. With a bound, a stale trace fails instead of being
            reported as this change's coverage.
          severity: high
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: report-coverage
        description: >-
          Report coverage from a trace that already exists, instead of measuring
          again.

          The skill's point is that measuring costs tens of minutes but
          re-reporting other files from the same trace costs milliseconds — so
          having measured once for a port, a second file is not worth a second
          instrumented build. The trace is bounded by
          `coverageTraceNotOlderThan`, so this fails rather than reporting gaps
          from a build that predates the code.
        guard: >-
          ${{ !inputs.measureCoverage || !inputs.reuseCoverageTrace || (size(inputs.coverageFiles) == 0 && data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() == 0) ? "skip" : "" }}
        task:
          type: model_method
          modelIdOrName: flow-coverage
          methodName: report
          inputs:
            files: >-
              ${{ size(inputs.coverageFiles) > 0 ? inputs.coverageFiles : data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.files }}
            notOlderThan: ${{ inputs.coverageTraceNotOlderThan }}
        # `analyze` as well as the bound check: this step's guard reads the
        # analysis to decide whether there is anything to report on, and without
        # waiting for it the guard can run first, see nothing, and skip — while
        # `measure-coverage` skips too because reuse was asked for. The tests
        # phase would then be told which files were measured and handed no
        # measurement at all.
        dependsOn:
          - step: coverage-trace-bounded
            condition:
              type: succeeded
          - step: analyze
            condition:
              type: always
        weight: 0
        allowFailure: false

      - name: write-tests
        description: >-
          Write the tests the change will be measured against, before any of it
          exists.
        # A string rather than a boolean: this guard depends only on the
        # inputs, so it is resolved when the workflow is evaluated, and an
        # evaluated guard has to still be a string. Empty is falsy and runs
        # the step; any other string skips it.
        guard: >-
          ${{ inputs.taskType == "feature" ? "skip" : "" }}
        task:
          type: model_method
          modelType: "@gdesmott/claude-task"
          modelName: task-tests
          methodName: tests
          globalArgs:
            # The agent works on the checkout, not on the swamp repository
            # directory this workflow lives in — one level up from it.
            workingDir: '..'
            model: ${{ inputs.agentModel }}
            permissionMode: ${{ inputs.permissionMode }}
            timeout: ${{ inputs.timeout }}
          inputs:
            label: >-
              ${{ inputs.label == "" ? run.id : inputs.label }}
            task: ${{ inputs.task }}
            context:
              taskType: ${{ inputs.taskType }}
              analysis: >-
                ${{ data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').map(r, r.attributes) }}
              # What was asked for, next to what was found. The measurement runs
              # as a child workflow, so its data carries that run's id rather
              # than this one's and cannot be scoped to this run from here — an
              # earlier measurement of different files would otherwise be handed
              # over as if it were this one's. Passing the request alongside lets
              # the agent see the mismatch, which is what the instructions below
              # tell it to do.
              # The files actually measured, not the override. In the normal
              # path the override is empty and the analysis supplies them, so
              # passing the override alone said "nothing was measured" — and the
              # instructions below take that to mean the coverage should be
              # ignored, which threw away the measurement this phase exists for.
              coverageRequested: >-
                ${{ !inputs.measureCoverage ? [] : (size(inputs.coverageFiles) > 0 ? inputs.coverageFiles : (data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() == 0 ? [] : data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.files)) }}
              # One record, and one this run produced. The store holds every
              # summary ever measured, and handing all of them over is wrong
              # twice over: the agent is told below to use only the files it
              # asked about, so the rest is read and discarded at token cost,
              # and the older ones describe code that has since changed.
              #
              # Matched on the files it reported — `targets`, one entry per
              # requested file. Not `requested`, which is the *number* of them;
              # treating that as a list is a runtime error, and one nothing
              # static would catch, since an expression reading `data` is never
              # evaluated until the run.
              #
              # Matched on those files, as well as being newer than this run. Time alone leaves a gap: a coverage report
              # finishing elsewhere in the window between this run's measurement
              # and the tests phase would be newer, and for the files the two
              # runs share the agent could not tell the difference.
              #
              # Bounded by when this run began rather than by taking the newest
              # in the store. The measurement is a child workflow, so its data
              # carries that run's id and cannot be scoped by `workflowRunId`
              # from here — but it cannot predate this run either, so anything
              # written since it started is ours. Without that bound a coverage
              # report finishing elsewhere between this step and the tests phase
              # would be handed over as though it described these files, and for
              # files the two runs share the agent could not tell.
              #
              # Matching the file set is not by itself proof of ownership, so
              # three more things have to hold. The summary has to be a `flow`
              # one, which excludes a unit-trace report over the same files. It
              # has to carry a freshness bound, which a direct `report` call
              # given no `notOlderThan` does not. And it must not be stale.
              #
              # What that bound has to say depends on which of the two coverage
              # steps ran, and asking the same question of both is what made
              # reuse deliver nothing at all. A measuring run builds the trace
              # inside this run, so its bound postdates this run — anything
              # older is a report somebody ran over an earlier trace. A reusing
              # run is the opposite by definition: `coverageTraceNotOlderThan`
              # is the reused trace's own `capturedAt`, which predates this run,
              # so demanding a bound newer than `run.startedAt` excluded the very
              # summary `report-coverage` had just written — and the tests agent
              # was handed an empty `coverage` beside a full `coverageRequested`,
              # which the instructions below tell it to read as "no coverage was
              # measured". There the binding is the bound matching what this run
              # asked for, which an unrelated report over the same files would
              # have to have been given by hand to satisfy.
              #
              # What remains is a full flow measurement, recorded during this
              # run, over exactly this run's files, from the trace this run
              # named; a second one of those, running concurrently on the same
              # checkout, would still be indistinguishable, and nothing short of
              # a marker the child records could tell them apart.
              #
              # The size mattered as well as the staleness: prompts used to be
              # passed as a single command-line argument, which Linux caps at
              # 128KB, so a long enough coverage history stopped the agent
              # spawning at all. Prompts now go over stdin, which removes the
              # ceiling — this stays bounded because it should be, not because
              # it has to be.
              coverage: >-
                ${{ inputs.measureCoverage && data.query('modelName == "flow-coverage" && name == "summary" && version >= 0 && attributes.executedAt > "' + run.startedAt + '"').filter(c, c.attributes.suite == "flow" && c.attributes.notOlderThan != null && (inputs.reuseCoverageTrace ? c.attributes.notOlderThan == inputs.coverageTraceNotOlderThan : c.attributes.notOlderThan > run.startedAt) && !c.attributes.stale && c.attributes.targets.size() == (size(inputs.coverageFiles) > 0 ? inputs.coverageFiles : data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.files).size() && c.attributes.targets.all(t, t.file in (size(inputs.coverageFiles) > 0 ? inputs.coverageFiles : data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.files))).size() > 0 ? [data.query('modelName == "flow-coverage" && name == "summary" && version >= 0 && attributes.executedAt > "' + run.startedAt + '"').filter(c, c.attributes.suite == "flow" && c.attributes.notOlderThan != null && (inputs.reuseCoverageTrace ? c.attributes.notOlderThan == inputs.coverageTraceNotOlderThan : c.attributes.notOlderThan > run.startedAt) && !c.attributes.stale && c.attributes.targets.size() == (size(inputs.coverageFiles) > 0 ? inputs.coverageFiles : data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.files).size() && c.attributes.targets.all(t, t.file in (size(inputs.coverageFiles) > 0 ? inputs.coverageFiles : data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.files)))[data.query('modelName == "flow-coverage" && name == "summary" && version >= 0 && attributes.executedAt > "' + run.startedAt + '"').filter(c, c.attributes.suite == "flow" && c.attributes.notOlderThan != null && (inputs.reuseCoverageTrace ? c.attributes.notOlderThan == inputs.coverageTraceNotOlderThan : c.attributes.notOlderThan > run.startedAt) && !c.attributes.stale && c.attributes.targets.size() == (size(inputs.coverageFiles) > 0 ? inputs.coverageFiles : data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.files).size() && c.attributes.targets.all(t, t.file in (size(inputs.coverageFiles) > 0 ? inputs.coverageFiles : data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.files))).size() - 1].attributes] : [] }}
            instructions: >-
              This is a ${{ inputs.taskType }} task. For a bugfix, the test must
              fail before any fix exists, and you must run it and quote the
              failure. For a port, the tests are the invariant across the port:
              scope them to the functions being ported rather than to whole
              files. Commit the tests on their own.

              The `coverage` context holds uncovered lines from the repository's
              flow-coverage measurement, and `coverageRequested` is what this run
              asked to measure. Use `coverage` only for the files named in
              `coverageRequested`: anything else in it is left over from an
              earlier measurement and says nothing about this change. If
              `coverageRequested` is empty, no coverage was measured for this run
              — judge the scope from the task instead, and do not report coverage
              you did not measure.

              Where it does apply, it is a floor and not a checklist: lines
              reachable only through the API are covered by the C++ tests rather
              than the Python ones, and disk-only and unreachable defensive code
              is not worth a test at all. Say in `coverageNotes` which gaps you
              closed and which you discarded, with the reason.
        # `always` on both, because exactly one of them runs and the other is
        # skipped. A hard failure in either still halts the job, so this cannot
        # let tests be written against coverage that failed to be produced.
        dependsOn:
          - step: measure-coverage
            condition:
              type: always
          - step: report-coverage
            condition:
              type: always
        weight: 0
        allowFailure: false

      - name: review-tests
        description: >-
          Review the tests as adversarially as the code will be reviewed later.

          The failure modes worth catching here are invisible in a passing run:
          an assertion that would still hold if the behaviour under test were
          removed, and a bug-fix test that fails for a different reason than the
          bug.
        # A string rather than a boolean: this guard depends only on the
        # inputs, so it is resolved when the workflow is evaluated, and an
        # evaluated guard has to still be a string. Empty is falsy and runs
        # the step; any other string skips it.
        guard: >-
          ${{ inputs.taskType == "feature" ? "skip" : "" }}
        task:
          type: workflow
          workflowIdOrName: review-loop
          inputs:
            task: ${{ inputs.task }}
            subject: the tests just written, and only those
            blockingSeverities: ${{ inputs.blockingSeverities }}
            label: >-
              ${{ inputs.label == "" ? run.id : inputs.label }}
            reviewer: tests-reviewer
            reviser: tests-reviser
            context:
              taskType: ${{ inputs.taskType }}
              analysis: >-
                ${{ data.query('modelName == "task-analyst" && name == "analysis" && version >= 0 && workflowRunId == "' + run.id + '"').map(r, r.attributes) }}
              tests: >-
                ${{ data.query('modelName == "task-tests" && name == "tests" && version >= 0 && workflowRunId == "' + run.id + '"').map(r, r.attributes) }}
            reviewInstructions: >-
              Load .skills/write-flow-tests/SKILL.md for changes under
              tests/pytests/ and .skills/rust-review/SKILL.md for Rust tests, and
              treat those guidelines as the review criteria. Two failure modes a
              passing run cannot reveal: an assertion that would still hold if
              the behaviour under test were removed, and a bug-fix test that
              fails for a different reason than the bug.
            reviseInstructions: >-
              Keep the tests committed on their own, with no implementation.
            agentModel: ${{ inputs.agentModel }}
            permissionMode: ${{ inputs.permissionMode }}
            timeout: ${{ inputs.timeout }}
        dependsOn:
          - step: write-tests
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: write-design
        description: >-
          Write the design document, at both the architecture and the program
          design level.
        # `always`, because for a feature task the two steps before this one are
        # skipped, and a `succeeded` dependency would skip the design with them.
        task:
          type: model_method
          modelType: "@gdesmott/claude-task"
          modelName: task-design-agent
          methodName: design
          globalArgs:
            # The agent works on the checkout, not on the swamp repository
            # directory this workflow lives in — one level up from it.
            workingDir: '..'
            model: ${{ inputs.agentModel }}
            permissionMode: ${{ inputs.permissionMode }}
            timeout: ${{ inputs.timeout }}
          inputs:
            label: >-
              ${{ inputs.label == "" ? run.id : inputs.label }}
            task: ${{ inputs.task }}
            context:
              taskType: ${{ inputs.taskType }}
              tests: >-
                ${{ data.query('modelName == "task-tests" && name == "tests" && version >= 0 && workflowRunId == "' + run.id + '"').map(r, r.attributes) }}
            instructions: >-
              This is a ${{ inputs.taskType }} task. Commit the approved design
              document on its own. If this is a large change — a new FT.* command
              or option, a new field or index type, a behaviour or
              persistence-format change, or a cross-cutting C/Rust refactor — say
              so in `largeChange` and follow docs/CONTRIBUTING-specs.md rather
              than treating a local review as sufficient.
        dependsOn:
          - step: review-tests
            condition:
              type: always
        weight: 0
        allowFailure: false

      - name: design-recorded
        description: >-
          The design was written down somewhere the next phase can read, rather
          than only described in the agent's answer. An empty path counts as no
          path: it satisfies a null check while naming nothing, and the parent
          hands it back as `expectedPlanPath=`, which reads as "do not pin" and
          quietly disables the check it was supposed to be. Phase 3 is measured against
          the document, so a design that exists only as a summary is not a
          design that was approved.
        task:
          type: assert
          expr: >-
            data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.planPath != null && data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.planPath != ""
          message: >-
            The design phase reported success without writing a design document.
            Its summary was:
            ${{ data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.summary }}
          severity: high
        dependsOn:
          - step: write-design
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: not-a-large-change
        description: >-
          A large change is not signed off by this flow.

          The repository requires more than a local design review for a new FT.*
          command or option, a new field or index type, a behaviour or
          persistence-format change, or a cross-cutting C/Rust refactor: a GitHub
          issue first for directional agreement, then proposal, design, tasks and
          spec delta iterated in a draft pull request, each stage gated by
          maintainer review. None of that is something an agent or an approval
          prompt here can stand in for.

          So the design phase is asked whether the change is large, and this stops
          the run when it says yes.

          It reads the design as first written. The review that follows can
          revise the document, and re-running this assert afterwards would read
          the same answer from the same record — so the reviewer is asked
          instead to raise a high-severity finding if its own changes would make
          the change a large one, which stops the loop rather than this assert. Set `specApproved` once the spec-driven
          workflow has actually been through maintainer review, and the flow
          continues from a design that has already been agreed.
        task:
          type: assert
          expr: >-
            inputs.specApproved
            || !data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.largeChange
          message: >-
            The design reports this as a large change, which needs the
            spec-driven workflow in docs/CONTRIBUTING-specs.md — a GitHub issue
            first, then proposal, design, tasks and spec delta reviewed by a
            maintainer. The design is recorded and readable with
            `swamp data get task-design-agent --json`; re-run with
            `--input specApproved:json=true` once that review has happened.
          severity: high
        dependsOn:
          - step: design-recorded
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: bugfix-test-seen-failing
        description: >-
          For a bug fix, the new test was watched failing before any fix existed.

          The evidence has to be about the test that survived the review, not the
          one first written: the reviser can replace a test that failed for the
          wrong reason, and the original quote would still be sitting there
          looking like proof.

          That failing run is the entire claim that the bug is real, and it can
          only be made now — once the fix lands the test passes, and no later
          phase can tell a test that reproduces the bug from one that never
          could. The tests phase is asked to quote the failure it observed, and
          this refuses a bug fix that did not.

          The revision that invalidates the quote has to be one of *this* run's.
          `tests-reviser` is a shared instance, so a review loop belonging to
          another task writes into the same place, and a bound of "after this
          run's tests were recorded" catches those too — which would demand
          `bugfixReproConfirmed` for a test nothing had touched, and teach the
          operator to pass it as a formality. Matched on the label this run
          gives its review loop instead.

          Whether the review changed the test is not left to the reviser's own
          `codeChanged`. That is a claim, and a reviser that edited the test and
          reported false would leave the original quote standing over a test
          that no longer exists — possibly one that no longer reproduces the bug
          at all, which is the whole of what this gate is for. So the paths the
          model derived from the checkout count too, and either is enough. The
          derived list is a superset, so a reviser that touched a file for any
          reason asks for `bugfixReproConfirmed`; that is the direction to err
          in, and it is narrower than it sounds, since a reviser that changed
          nothing has an empty list.

          The predicate short-circuits for the other task types, which is what
          keeps it from reading test data that a `feature` run never produced.
        task:
          type: assert
          expr: >-
            inputs.taskType != "bugfix"
            || ((data.query('modelName == "task-tests" && name == "tests" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-tests" && name == "tests" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.failingAsExpected != null && data.query('modelName == "task-tests" && name == "tests" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-tests" && name == "tests" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.failingAsExpected != "")
                && (inputs.bugfixReproConfirmed || !data.query('modelName == "tests-reviser" && name == "revision" && version >= 0').exists(r, (r.attributes.codeChanged || r.attributes.agent.?pathsTouched.orValue([]).size() > 0) && r.attributes.agent.label == (inputs.label == "" ? run.id : inputs.label) && r.attributes.agent.executedAt > data.query('modelName == "task-tests" && name == "tests" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-tests" && name == "tests" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.agent.executedAt)))
          message: >-
            This is a bugfix, but the tests phase recorded no observed failure,
            recorded an empty one, or had its tests changed by the review after
            recording it. The quote describes the test as first written, so a
            review that replaced it leaves the evidence pointing at something
            that no longer exists. Watch the final test fail and re-run with
            `--input bugfixReproConfirmed:json=true`.
            A test that was never seen failing is not evidence the bug exists —
            run it before the fix and quote what it printed.
          severity: high
        dependsOn:
          - step: not-a-large-change
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: review-design
        description: >-
          Review the design until nothing is left unresolved — every finding
          either fixed or refuted with evidence.
        task:
          type: workflow
          workflowIdOrName: review-loop
          inputs:
            task: ${{ inputs.task }}
            subject: >-
              the design document at
              ${{ data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"')[data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"').size() - 1].attributes.planPath }}
            blockingSeverities: ${{ inputs.blockingSeverities }}
            label: >-
              ${{ inputs.label == "" ? run.id : inputs.label }}
            reviewer: design-reviewer
            reviser: design-reviser
            context:
              taskType: ${{ inputs.taskType }}
              design: >-
                ${{ data.query('modelName == "task-design-agent" && name == "design" && version >= 0 && workflowRunId == "' + run.id + '"').map(r, r.attributes) }}
            reviewInstructions: >-
              If your findings would turn this into a large change — a new FT.*
              command or option, a new field or index type, a behaviour or
              persistence-format change, or a cross-cutting C/Rust refactor —
              say so as a high severity finding. The gate that catches those ran
              before you, on the design as first written, and nothing re-reads it
              afterwards; a high finding is what stops the loop and puts it back
              in front of a person.

              Review both levels the skill asks for: the architecture — problem,
              user-visible surface, subsystems, data model, edge cases,
              alternatives rejected — and the program design, meaning the types,
              the signatures, the file layout, and the call stacks. A design that
              is agreed at the architecture level and vague about the code is the
              one that produces arguments in code review.
            reviseInstructions: >-
              Keep the design document as its own commit, with no implementation.
            agentModel: ${{ inputs.agentModel }}
            permissionMode: ${{ inputs.permissionMode }}
            timeout: ${{ inputs.timeout }}
        dependsOn:
          - step: bugfix-test-seen-failing
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

    dependsOn: []
    weight: 0
version: 1
