name: Read-only failed runner lifecycle probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configure existing sccache role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.SCCACHE_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.SCCACHE_S3_REGION }}
          mask-aws-account-id: true
          retry-max-attempts: 1
      - name: Read only the failed instance lifecycle
        env:
          AWS_MAX_ATTEMPTS: '1'
          AWS_PAGER: ''
        run: python3 .github/scripts/probe_runner_lifecycle.py
      - name: Retain sanitized result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: failed-runner-lifecycle
          path: runner-lifecycle.json
          retention-days: 3
          if-no-files-found: error
