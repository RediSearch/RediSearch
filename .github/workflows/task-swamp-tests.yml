name: Swamp extension tests

# Documentation: https://redislabs.atlassian.net/wiki/spaces/DX/pages/3967844669/RediSearch+CI+refactor
#
# Stands alone rather than sitting inside task-lint.yml: it shares nothing with
# linting — not the container, not the toolchain, not the permissions — and a
# change confined to extensions/, models/ or workflows/ has to reach this gate
# without being held to `make lint`, cargo-deny and the Rust cache setup it
# cannot affect.

on: [workflow_call]

jobs:
  swamp-tests:
    name: Swamp extension tests
    # Holds nothing but read access to the repository.
    #
    # These tests are the contents of the pull request being tested: a change to
    # extensions/models/*_test.ts is code that CI then executes. Anything this
    # job holds is within reach of it — which is why it holds no OIDC and no
    # Actions cache write, and why keeping it out of a job that needs those for
    # sccache and the Rust cache is the point. Deno's sandbox is not the
    # boundary being relied on either: the suite needs `--allow-run` to drive
    # the fake executables its tests spawn, and a subprocess runs outside the
    # sandbox by design.
    #
    # So the boundary is the job: nothing to take. It needs no toolchain beyond
    # deno, which is why it can stand alone at all.
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read # actions/checkout, and nothing else
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # This job runs the pull request's own Deno tests, with --allow-run
          # and --allow-env, so anything the checkout leaves lying around is
          # readable by code the contributor wrote. Credential persistence is on
          # by default and keeps the job token where those tests can find it,
          # which undoes the point of the narrow `contents: read` above. Nothing
          # here needs authenticated git — the checkout is the only git step.
          persist-credentials: false
      - name: Setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Without swamp the definition half of `make swamp-tests` skips itself,
      # and for a pull request touching only workflows/ or models/ this job is
      # the only gate that reads them at all — so a guard that cannot evaluate
      # would pass CI and fail the first time somebody ran it. SWAMP_REQUIRED
      # below turns that skip into a failure, which is only safe because this
      # step puts swamp on PATH first.
      - name: Install swamp
        run: |
          mkdir -p "$HOME/.local/bin"
          # --proto/--proto-redir pin the scheme across redirects: -L follows
          # them, and without this a redirect could downgrade to plain HTTP —
          # for a binary this job then executes.
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 5 \
            https://artifacts.swamp-club.com/swamp/stable/binary/linux/x86_64/swamp-stable-binary-linux-x86_64.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/swamp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Which swamp validated this run, recorded in the log so a result that
          # differs from a rerun of the same commit can be explained.
          #
          # `stable` moves, and there is no published artifact for a specific
          # version to pin to — so the guarantee available is a floor rather than
          # a pin: refuse anything older than the version this repository was
          # initialised with, since validating against a swamp that predates the
          # definitions proves nothing about them. Newer is allowed, and is what
          # `stable` gives.
          installed="$("$HOME/.local/bin/swamp" --version | sed 's/\x1b\[[0-9;]*m//g' | awk '{print $2}')"
          configured="$(sed -n 's/^swampVersion: *//p' .swamp.yaml)"
          echo "swamp $installed (repository recorded $configured)"
          if [ -n "$configured" ] && [ "$(printf '%s\n%s\n' "$configured" "$installed" | sort -V | head -1)" != "$configured" ]; then
            echo "Installed swamp $installed is older than the recorded $configured." >&2
            exit 1
          fi
      # Two steps rather than `make swamp-tests`, so the ordering is visible and
      # not a property of make: the definitions are validated before any
      # PR-controlled test code runs, because that code can write to the tree.
      - name: Swamp definition checks
        run: make swamp-definitions-check SWAMP_REQUIRED=1
      - name: Swamp extension tests
        run: make swamp-extension-tests
