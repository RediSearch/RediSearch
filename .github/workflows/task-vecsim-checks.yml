name: VecSim static checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: VecSim CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build VecSim for analysis
        run: make -C src/vecsim build NO_TESTS=1
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          category: vecsim

  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check VecSim formatting
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
          mkdir -p "$RUNNER_TEMP/vecsim-tools"
          ln -s /usr/bin/clang-format-18 "$RUNNER_TEMP/vecsim-tools/clang-format"
          PATH="$RUNNER_TEMP/vecsim-tools:$PATH" make -C src/vecsim check-format
