name: Backport merged pull request (Codex agent)

# Agent-driven counterpart of `task-backport_pr.yml`. The two flows are decoupled
# by label namespace so you can roll the agent flow forward or back without
# touching the existing `korthout/backport-action` path.
#
#   `backport <branch>`           -> handled by task-backport_pr.yml (korthout action)
#   `backport-<branch>-agent`     -> handled by this workflow (Codex agent)
#
# Trigger ways:
#   - PR is closed and merged with at least one `backport-<branch>-agent` label.
#   - A `backport-<branch>-agent` label is added to an already-merged PR (the run
#     resolves EVERY matching label on the PR, not just the one that fired).
#   - A repo collaborator/member/owner comments `/backport-agent` on a merged PR.
#       `/backport-agent 8.6 8.2` overrides labels; `/backport-agent >= 2.10`
#       expands to every active release branch at or above 2.10 (from
#       .github/release-branches.json); forms can be mixed.
#
# PRIVILEGE SEPARATION (why this workflow has the shape it does)
#   The Codex agent step runs with **no GitHub token and no command network**: it
#   only cherry-picks each target onto a local branch in a pre-made clone and
#   writes a manifest describing the result (see pr-backport-auto.md). A separate
#   deterministic step (scripts/auto_backport/apply_create.py) holds the scoped
#   App write token and performs every mutation — push, `gh pr create`, labels,
#   summary comment — from that manifest, validating each field as data (exact
#   branch shape, target allow-list, argument arrays). So a prompt-injection in
#   anything the agent reads cannot push code, open arbitrary PRs, use a token,
#   or reach the network: the powerful credential is never in the LLM's hands.

on:
  pull_request_target:
    types: [closed, labeled]
  issue_comment:
    types: [created]

# The default GITHUB_TOKEN is read-only (checkout + clone/fetch + `gh pr view`).
# The App write token is minted late and only reaches the Apply step.
permissions:
  contents: read
  pull-requests: read

# Serialize per-PR so the triggers can't race on the same
# `backport-agent/pr-<n>-to-<branch>` branches. Never cancel in-flight — a run
# may already have opened some target PRs.
concurrency:
  group: backport-agent-create-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

env:
  # Writable roots the (sandboxed, network-less) agent uses. /tmp is writable
  # under the codex workspace-write sandbox; $RUNNER_TEMP is not guaranteed to be.
  BACKPORT_WORK: /tmp/backport-agent-work
  BACKPORT_MANIFEST_FILE: /tmp/backport-agent-manifest.json

jobs:
  backport-agent:
    name: Auto-backport via Codex
    runs-on: ubuntu-slim
    timeout-minutes: 60

    # The `author_association` allow-list (OWNER/MEMBER/COLLABORATOR) is a coarse
    # trigger pre-filter. NOTE: association is not repository write access — a
    # real write-permission gate on the Apply step is tracked as a follow-up.
    if: >
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'closed' &&
        github.event.pull_request.merged &&
        contains(toJSON(github.event.pull_request.labels.*.name), '"backport-')
      ) || (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'labeled' &&
        github.event.pull_request.merged &&
        startsWith(github.event.label.name, 'backport-') &&
        endsWith(github.event.label.name, '-agent')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/backport-agent') &&
        !startsWith(github.event.comment.body, '/backport-agent-')
      )

    steps:
      - name: Checkout master (with full history)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Read-only default token. Literal `master` (no PR-head ref) keeps this
          # safe under `pull_request_target` — no fork code is ever checked out.
          ref: master
          fetch-depth: 0

      - name: Configure git identity
        # Global so the pre-made clone (and the agent's cherry-pick commits in it)
        # inherit the bot identity.
        run: |
          git config --global user.name "redis-pr-app[bot]"
          git config --global user.email "redis-pr-app[bot]@users.noreply.github.com"

      # resolve_create.py derives the target-branch list (labels / `<list>` /
      # `>= <version>` expansion) and pre-fetches the original PR title+body so
      # the agent needs no `gh`. Read-only default token.
      - name: Resolve PR context and target branches
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER_FROM_PR: ${{ github.event.pull_request.number }}
          PR_NUMBER_FROM_ISSUE: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python3 scripts/auto_backport/resolve_create.py

      # Deterministic prep: a writable clone with master + squash commit + every
      # target ref already fetched, so the agent needs zero network. Read-only
      # token; `--reference-if-able` reuses the checkout's objects to stay fast.
      - name: Prepare working clone for the agent
        if: steps.ctx.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKPORT_CONTEXT_FILE: ${{ steps.ctx.outputs.context_file }}
        run: |
          set -euo pipefail
          rm -rf "$BACKPORT_WORK"
          git clone --no-tags --reference-if-able "${GITHUB_WORKSPACE}/.git" \
            "https://github.com/${GITHUB_REPOSITORY}" "$BACKPORT_WORK"
          git -C "$BACKPORT_WORK" config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -C "$BACKPORT_WORK" fetch --no-tags origin master
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            git -C "$BACKPORT_WORK" fetch --no-tags origin "+refs/heads/${t}:refs/remotes/origin/${t}" || true
          done < <(jq -r '.targets[]' "$BACKPORT_CONTEXT_FILE")
          # Drop the read credential before the agent runs so it inherits nothing.
          git -C "$BACKPORT_WORK" config --unset-all http.https://github.com/.extraheader || true

      - name: Run /pr-backport-auto via Codex (no token, no network)
        if: steps.ctx.outputs.skip != 'true'
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1 # v1.8
        env:
          # Deliberately NO GH_TOKEN. The agent reads the context and the pre-made
          # clone and writes a manifest — nothing that needs GitHub auth.
          BACKPORT_CONTEXT_FILE: ${{ steps.ctx.outputs.context_file }}
        with:
          openai-api-key: ${{ secrets.OPEN_AI_BACKPORT_AGENT_KEY }}
          prompt-file: .github/codex/prompts/pr-backport-auto.md
          # workspace-write + NO network override: the agent's shell commands are
          # network-isolated (the model API call is made by the codex runtime, not
          # a sandboxed command, so it still works). Nothing the agent runs can
          # reach the network → no exfiltration, no push.
          sandbox: workspace-write
          safety-strategy: drop-sudo
          # Queue-merged PRs fire with actor = github-merge-queue[bot]; trust it
          # (a human still applied the label and our `if:` requires it).
          allow-bots: true
          allow-bot-users: github-merge-queue[bot]

      - name: 🔑 Generate GitHub App Token (for the apply step only)
        id: generate-app-token
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_PR_APP_ID }}
          private-key: ${{ secrets.GH_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scope to THIS repo only; hard-cap to exactly what apply_create.py needs.
          repositories: ${{ github.event.repository.name }}
          permission-contents: write       # push backport-agent/* branches
          permission-pull-requests: write  # open / label / comment on PRs
          # A backport that re-merges a .github/workflows/* file produces a blob
          # GitHub refuses from a `workflows`-less App token — see git history.
          permission-workflows: write

      # apply_create.py is the ONLY component that holds the write token. It
      # validates the agent's manifest (branch shape, target allow-list) and
      # pushes / opens PRs / labels / comments via argument arrays.
      - name: Apply backport manifest
        if: steps.ctx.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          BACKPORT_CONTEXT_FILE: ${{ steps.ctx.outputs.context_file }}
        run: python3 scripts/auto_backport/apply_create.py
