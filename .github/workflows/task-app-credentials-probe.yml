name: Verify fast-track GitHub App credentials

on:
  push:
    branches: [guy-app-credentials-probe]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Mint repository-scoped pull-request token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FAST_TRACK_APP_CLIENT_ID }}
          private-key: ${{ secrets.FAST_TRACK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Approve and dismiss controlled draft PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        shell: python
        run: |
          import json
          import os
          import urllib.request
          import urllib.error

          def call(path, method="GET", body=None):
              request = urllib.request.Request(
                  "https://api.github.com" + path, method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"GitHub {method} failed: HTTP {error.code}") from None

          path = "/repos/RediSearch/RediSearch/pulls/11892"
          pr = call(path)
          assert pr["draft"] and pr["state"] == "open"
          assert pr["base"]["ref"] == "master"
          assert pr["head"]["ref"] == "guy-app-credentials-probe"
          assert os.environ["APP_SLUG"] == "redisearch-ai-auto-approval-agent"
          review = call(path + "/reviews", "POST", {
              "event": "APPROVE", "commit_id": pr["head"]["sha"],
              "body": "Controlled permission probe only. This approval will immediately be dismissed. Do not merge.",
          })
          print("Approval created:", review["id"], review["state"])
          dismissed = call(path + f"/reviews/{review['id']}/dismissals", "PUT", {
              "message": "Controlled probe complete: verify App can revoke its own approval on master."
          })
          assert dismissed["state"] == "DISMISSED"
          verified = call(path + f"/reviews/{review['id']}")
          assert verified["state"] == "DISMISSED"
          print("Verified review state:", verified["state"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"App {os.environ['APP_SLUG']} approved and dismissed review {review['id']} on draft PR #11892 targeting master.\n")
