name: Verify existing GitHub App credentials

on:
  push:
    branches: [guy-app-credentials-probe]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint repository-scoped pull-request token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_PR_APP_ID }}
          private-key: ${{ secrets.GH_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Report App identity and verify read access
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError("redirect refused")

          request = urllib.request.Request(
              "https://api.github.com/repos/RediSearch/RediSearch/pulls?state=open&per_page=1",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"},
          )
          result = {
              "app_slug": os.environ["APP_SLUG"],
              "installation_id": os.environ["INSTALLATION_ID"],
              "matches_requested_app": os.environ["APP_SLUG"] == "redisearch-ai-coding-agent",
              "repository_scoped_pull_requests_write_token_created": True,
          }
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                  result["pull_requests_readable"] = isinstance(json.load(response), list)
          except urllib.error.HTTPError as error:
              result["http_status"] = error.code
              result["pull_requests_readable"] = False
          except Exception as error:
              result["error_type"] = type(error).__name__
              result["pull_requests_readable"] = False
          output = json.dumps(result, indent=2)
          print(output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("GitHub App credential verification\n\n```json\n" + output + "\n```\n")
          sys.exit(0 if result["pull_requests_readable"] else 1)
