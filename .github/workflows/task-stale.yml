name: 'Close stale issues and PRs'
# Documentation: https://redislabs.atlassian.net/wiki/spaces/DX/pages/3967844669/RediSearch+CI+refactor

on:
  schedule:
    - cron: '30 1 * * *'

jobs:
  stale:
    permissions: # actions/stale comments on and closes stale issues and PRs
      issues: write
      pull-requests: write
      # `operations-per-run: 1000` below is a finite budget, so a large backlog can
      # exhaust it; actions/stale then saves its cursor to the Actions cache and
      # resumes on the next run. Its own restricted-permissions example lists this.
      actions: write
    runs-on: ubuntu-slim
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
            days-before-stale: 60
            days-before-close: -1
            stale-issue-label: "stale"
            stale-issue-message: "This issue is stale because it has been open for 60 days with no activity."
            close-issue-message: "This issue was closed because it has been inactive for 7 days since being marked as stale."
            stale-pr-label: "stale"
            stale-pr-message: "This pull request is stale because it has been open for 60 days with no activity."
            close-pr-message: "This pull request was closed because it has been inactive for 7 days since being marked as stale."
            operations-per-run: 1000
