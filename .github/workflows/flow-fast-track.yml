name: Validate and Approve Fast-Track PR

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
    secrets:
      FAST_TRACK_APP_PRIVATE_KEY:
        description: Dedicated approval App private key
        required: true
      JIRA_USER_EMAIL:
        required: true
      JIRA_API_TOKEN:
        required: true

permissions: {}

concurrency:
  group: fast-track-${{ github.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  approve:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/fast_track

      - name: Validate Jira eligibility
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTER: ${{ github.triggering_actor }}
          JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python3 scripts/fast_track/approval.py validate --decision "$RUNNER_TEMP/fast-track.json"

      - name: Create dedicated approval token
        if: steps.validation.outputs.eligible == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FAST_TRACK_APP_CLIENT_ID }}
          private-key: ${{ secrets.FAST_TRACK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Approve validated head
        if: steps.validation.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: python3 scripts/fast_track/approval.py approve --decision "$RUNNER_TEMP/fast-track.json"
