name: Merge a pull request
run-name: Validate ${{ github.ref_name }}

# Documentation: https://redislabs.atlassian.net/wiki/spaces/DX/pages/3967844669/RediSearch+CI+refactor

# Floor, not a grant: every job below declares what it needs, so this only
# stops a job added later from silently inheriting the repository default.
permissions: {}

on:
  merge_group:
    types: [checks_requested]

concurrency:
  # This group identifies the PR by the tree ID of the head commit.
  # TODO: Replace with PR number of branch name once GH adds it to the event context
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_commit.tree_id }}
  cancel-in-progress: true

jobs:
  get-latest-redis-tag:
    permissions: {}
    uses: ./.github/workflows/task-get-latest-tag.yml
    with:
      repo: redis/redis

  lint:
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC role assumption for sccache S3 (used inside task-lint.yml)
      actions: write  # Swatinem/rust-cache read/write of GH cache (used inside task-lint.yml)
    uses: ./.github/workflows/task-lint.yml
    secrets: inherit
    with:
      compare-advisories-to-base: true
      advisories-base-ref: ${{ github.event.merge_group.base_sha }}

  build-unique-oses:
    needs: get-latest-redis-tag
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC role assumption for sccache S3 (used inside task-test.yml)
      actions: write  # Swatinem/rust-cache read/write of GH cache (used inside task-test.yml)
    uses: ./.github/workflows/flow-test.yml
    secrets: inherit
    with:
      # This job only builds (skip-tests), so it does not hit the flaky macOS
      # test runners; keep macOS Intel (x86_64) here for build coverage.
      platform: 'macos-26,alpine:3.23,intel'
      architecture: all
      redis-ref: ${{ needs.get-latest-redis-tag.outputs.tag }}
      options: skip-tests,fail-fast
      rejson-branch: master

  # ------------------------------------------------------------------
  # The ubuntu test lane, in two mutually exclusive flavours.
  #
  # master goes through flow-pr-pipeline.yml: one build, then unit +
  # standalone + coordinator as separate concurrent jobs off a single
  # artifact. Release branches keep the task-test.yml monolith, where the
  # build and every suite run as sequential steps on one runner.
  #
  # Both feed the same `pr-validation` aggregate, and a skipped job reports
  # `skipped` (which that gate treats as passing), so the required check name
  # is identical for either branch family.
  #
  # Only the release-branch lane passes `fail-fast`. In the monolith it saves
  # real time by skipping the test steps that follow a failure; in the fan-out
  # those steps are already-running sibling jobs, and `pr-validation` waits for
  # every job regardless — so cancelling them would buy no wall time and cost
  # the full failure picture, which is what a queue eviction needs.
  # ------------------------------------------------------------------

  test-ubuntu-master:
    # Always run tests for merge queue submissions, including text-only PRs.
    needs: get-latest-redis-tag
    if: ${{ github.event.merge_group.base_ref == 'refs/heads/master' }}
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC role assumption for sccache S3 (used inside flow-pr-pipeline.yml)
      actions: write  # Swatinem/rust-cache read/write of GH cache (used inside flow-pr-pipeline.yml)
    uses: ./.github/workflows/flow-pr-pipeline.yml
    secrets: inherit
    with:
      job-type: basic-test
      platform: ubuntu:noble
      architecture: x86_64
      redis-ref: ${{ needs.get-latest-redis-tag.outputs.tag }}
      test-config: QUICK=1
      rejson-branch: master
      # This lane only runs tests, so the LTO link is dead weight on the queue's
      # critical path. LTO codegen is still covered on master by
      # event-periodic-master-validation.yml and event-nightly.yml, both of
      # which build ubuntu:noble with the platform default.
      enable-lto: '0'

  test-ubuntu-release-branch:
    needs: get-latest-redis-tag
    if: ${{ github.event.merge_group.base_ref != 'refs/heads/master' }}
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC role assumption for sccache S3 (used inside task-test.yml)
      actions: write  # Swatinem/rust-cache read/write of GH cache (used inside task-test.yml)
    uses: ./.github/workflows/flow-test.yml
    secrets: inherit
    with:
      platform: ubuntu:noble
      architecture: x86_64
      redis-ref: ${{ needs.get-latest-redis-tag.outputs.tag }}
      job-test-config: '{"test": "QUICK=1", "coverage": "QUICK=1", "sanitize": "QUICK=1", "ubsan": "QUICK=1"}'
      options: unit-tests,coordinator,standalone,rejson,fail-fast,ubsan
      # Full alignment UBSan currently exposes unrelated pre-existing UB in the
      # C/C++ suite. Keep the merge-queue lane focused on the trie regression
      # until those findings are fixed separately.
      ubsan-unit-test-filter: 'TrieTest\.test.*ScansPackedChildKeys'
      separate-coordinator-job: true
      rejson-branch: master

  pr-validation:
    permissions: {} # aggregation gate: inspects needs.* only
    needs:
      - get-latest-redis-tag
      - lint
      - build-unique-oses
      - test-ubuntu-master
      - test-ubuntu-release-branch
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
