name: Trigger website deploy

# Documentation: https://redislabs.atlassian.net/wiki/spaces/DX/pages/3967844669/RediSearch+CI+refactor

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+'
    paths:
      - 'docs/**'
      - 'coord/docs/**'
      - 'commands.json'

jobs:
  trigger:
    permissions: {} # curls a Netlify build hook
    runs-on: ubuntu-slim
    steps:
      - name: Configure Tracebit canary credentials
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      # TODO: Use netlify/actions/build@master action instead of curl
      - run: |
          echo "'$DATA'" | xargs \
          curl \
          -X POST https://api.netlify.com/build_hooks/${NETLIFY_BUILD_HOOK_ID} \
          -d
        env:
          NETLIFY_BUILD_HOOK_ID: ${{ secrets.NETLIFY_BUILD_HOOK_ID }}
          DATA: '{"repository":"${{ github.repository }}", "sha":"${{ github.sha }}", "ref":"${{ github.ref }}"}}'
