name: Filtered vector benchmark tools

on:
  pull_request:
    paths:
      - tests/benchmarks/filtered-vector/**
      - .github/workflows/filtered-vector-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: --require-hashes -r tests/benchmarks/filtered-vector/requirements.txt
      - run: python -m unittest discover -s tests/benchmarks/filtered-vector -p 'test_*.py' -v
