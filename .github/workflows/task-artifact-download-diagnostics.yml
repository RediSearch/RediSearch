name: Artifact download diagnostics

# Evidence collection only; the production download steps are unchanged.
on:
  push:
    branches: [omer-ci-artifact-download-20261028]
    paths: [.github/workflows/task-artifact-download-diagnostics.yml]
  workflow_dispatch:
    inputs:
      artifact-id:
        description: Retained build artifact to download
        type: string
        default: '12807206693'
      run-id:
        description: Workflow run that produced the artifact
        type: string
        default: '40666098878'

permissions: {}

jobs:
  download:
    runs-on: staging-u-x64-medium
    container: ubuntu:26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch the pinned upstream action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: actions/download-artifact
          ref: 37930b1c2abaa49bbe596cd826c3c89aef350131
          path: .artifact-download-action
          persist-credentials: false

      - name: Expose retry diagnostics without signed URLs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const file = '.artifact-download-action/dist/index.js';
            const source = fs.readFileSync(file, 'utf8');
            const original = 'core.debug(`Failed to download artifact after ${retryCount} retries due to ${error.message}. Retrying in 5 seconds...`);';
            if (source.split(original).length !== 2) {
              throw new Error('Pinned upstream retry log does not match');
            }
            // Request-timeout messages include a SAS query. Never print the raw
            // message, even in debug logs; expose only known categories.
            const replacement = `
              const message = String(error.message);
              const status = /^Unexpected HTTP response from blob storage: ([0-9]{3})/.exec(message);
              const category = status ? 'http' :
                message.startsWith('Request timeout:') ? 'request-timeout' :
                message.startsWith('Blob storage chunk did not respond') ? 'stream-timeout' : 'other';
              const safeField = value => /^[A-Za-z0-9_]{1,40}$/.test(value || '') ? value : 'unknown';
              core.info(JSON.stringify({
                retry: retryCount,
                elapsedMs: Math.round(process.uptime() * 1000),
                category,
                status: status ? status[1] : null,
                name: safeField(error.name),
                code: safeField(error.code)
              }));`;
            fs.writeFileSync(file, source.replace(original, replacement));

      - name: Record runner resources
        shell: bash
        run: |
          date -u
          df -h .
          cat /proc/meminfo

      - name: Download retained build artifact
        uses: ./.artifact-download-action
        with:
          artifact-ids: ${{ inputs.artifact-id || '12807206693' }}
          run-id: ${{ inputs.run-id || '40666098878' }}
          github-token: ${{ github.token }}
          path: artifact-download-diagnostics

      - name: Record final resources
        if: always()
        shell: bash
        run: |
          date -u
          df -h .
          cat /proc/meminfo
