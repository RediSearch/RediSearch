name: Get Redis Tag

on:
  workflow_call:
    inputs:
      prefix:
        description: "Prefix to filter tags, for getting latest release of a specific version"
        type: string
        default: ''
      pinned-ref:
        description: "Redis ref override. Empty uses .github/redis-ref or REDIS_REF."
        type: string
        default: ''
      use-latest-release:
        description: "Resolve the latest release tag instead of the repository Redis ref."
        type: boolean
        default: false
    outputs:
      tag:
        description: "Redis tag or pinned ref"
        value: ${{ jobs.resolve.outputs.tag }}

jobs:
  pinned-ref:
    if: ${{ !inputs.use-latest-release }}
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.resolve-redis-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: resolve-redis-ref
        uses: ./.github/actions/resolve-redis-ref
        with:
          redis-ref: ${{ inputs.pinned-ref }}
          redis-ref-variable: ${{ vars.REDIS_REF }}

  latest-release-tag:
    if: ${{ inputs.use-latest-release }}
    permissions: {}
    uses: ./.github/workflows/task-get-latest-tag.yml
    with:
      repo: redis/redis
      prefix: ${{ inputs.prefix }}

  resolve:
    needs: [pinned-ref, latest-release-tag]
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          PINNED_TAG: ${{ needs.pinned-ref.outputs.tag }}
          LATEST_TAG: ${{ needs.latest-release-tag.outputs.tag }}
        run: |
          TAG="${PINNED_TAG:-$LATEST_TAG}"
          if [[ -z "$TAG" ]]; then
            echo "Failed to resolve Redis ref" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
