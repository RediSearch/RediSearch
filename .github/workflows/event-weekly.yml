name: Weekly Flow

# Documentation: https://redislabs.atlassian.net/wiki/spaces/DX/pages/3967844669/RediSearch+CI+refactor

# Floor, not a grant: every job below declares what it needs, so this only
# stops a job added later from silently inheriting the repository default.
permissions: {}

on:
  schedule:
    - cron: "20 20 * * 0"

jobs:
  run-benchmarks:
    permissions:
      contents: read
      actions: read   # fetch-failed-run-logs (triage) reads job logs via the actions REST API
      id-token: write # OIDC role assumption for sccache S3 (used inside flow-build-benchmark-binary.yml)
    uses: ./.github/workflows/benchmark-runner.yml
    secrets: inherit
    with:
      extended: true
      notify_failure: true

  link-check:
    permissions: # actions/checkout
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install --system -r scripts/requirements-linkcheck.txt

    - name: Check links in documentation
      run: |
        python scripts/check_links.py . \
          --timeout 15 \
          --max-workers 5 \
          --delay 0.2
