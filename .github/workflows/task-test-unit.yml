name: Common Flow for Unit Tests

# Documentation: https://redislabs.atlassian.net/wiki/spaces/DX/pages/3967844669/RediSearch+CI+refactor
#
# Reusable workflow that runs the C/C++ unit tests, the Rust unit tests, and
# (under sanitizer builds) the MIRI tests against a pre-built RediSearch tree
# produced by `task-build.yml`. The build artifact is downloaded into `bin/`;
# no C/C++ or Rust compilation happens here unless cargo decides something is
# out of date.

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform name (e.g., ubuntu:noble, macos-15)'
        type: string
        required: true
      architecture:
        description: 'Architecture (x86_64, aarch64)'
        type: string
        required: true
      san:
        type: string
      coverage:
        type: boolean
        default: false
      redis-ref:
        description: 'Redis version to use (only consumed by setup steps that key caches on it).'
        type: string
        default: 'd3abc02fed6664cc0afaf9ffe4e172a99e274f44'
      test-timeout:
        type: number
        default: 120
      fail-fast:
        type: boolean
        default: false
        description: "If true, the workflow will terminate as soon as one test step fails."
      artifact-name:
        description: 'Workflow artifact name to download (produced by task-build.yml).'
        type: string
        required: true
      # Resolved platform config — produced by task-get-config.yml at the
      # pipeline level so this workflow doesn't redo it. Caller must supply.
      name:
        type: string
        default: ''
      container:
        type: string
        default: ''
      env:
        type: string
        default: ''
      install-mode:
        type: string
        default: ''
      setup-script:
        type: string
        default: ''
      post-setup-script:
        type: string
        default: ''
      # Prebuilt container image (task-build-cached-container.yml outputs).
      image:
        type: string
        default: ''
      image-is-mirror:
        type: string
        default: 'false'
      image-built:
        description: "'true' when the prebuilt image is available; falls back to inputs.container otherwise."
        type: string
        default: 'false'

env:
  COV: ${{ inputs.coverage && 1 || 0 }}
  RUST_BACKTRACE: "full"
  RUSTFLAGS: "-Dwarnings"
  SETUP_RETRY_LOOP: |
    SUCCESS=0
    for i in 1 2 3 4 5; do
      echo "Attempt $i of 5"
      if {0}; then
        echo "Setup succeeded"
        SUCCESS=1
        break
      fi
      if [ $i -lt 5 ]; then
        echo "Setup failed, retrying in 30 seconds..."
        sleep 30
      fi
    done
    [ $SUCCESS -eq 1 ] || exit 1

jobs:
  common-flow-ghcr:
    if: ${{ inputs.container != '' && inputs.image-built == 'true' && inputs.image-is-mirror != 'true' }}
    name: Unit / ghcr
    runs-on: ${{ inputs.env || vars.RUNS_ON || 'ubuntu-latest' }}
    # Runner-local env is unavailable while GitHub creates the job container.
    # Use the resolved runner label as the pre-container signal for GitHub-hosted
    # mounts; runner-local env is not available yet.
    container:
      image: ${{ inputs.image }}
      options: &common_flow_container_options >-
        --user root
        ${{ startsWith(inputs.container, 'alpine:') && (startsWith(inputs.env || vars.RUNS_ON || 'ubuntu-latest', 'ubuntu') && '-v /opt:/opt:rw,rshared -v /opt:/__e/node20:ro,rshared -v /opt:/__e/node24:ro,rshared' || '-v /opt/gha-alpine-node:/opt:rw -v /opt/gha-alpine-node:/__e/node20:ro -v /opt/gha-alpine-node:/__e/node24:ro') || '' }}
        ${{ startsWith(inputs.env || vars.RUNS_ON || 'ubuntu-latest', 'ubuntu') && '-v /usr/share/dotnet:/host/usr/share/dotnet -v /usr/local/lib/android:/host/usr/local/lib/android -v /opt/ghc:/host/opt/ghc -v /opt/hostedtoolcache:/host/opt/hostedtoolcache' || '' }}

    permissions: &common_flow_permissions
      contents: read
      id-token: write
      packages: read
      actions: read   # download artifact from the build job

    env: &common_flow_env
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    defaults: &common_flow_defaults
      run:
        shell: bash -l -eo pipefail {0}
    steps: &common_flow_steps
      - name: Install bash
        if: startsWith(inputs.container, 'alpine:')
        shell: sh -l -eo pipefail {0}
        run: ${{ format(env.SETUP_RETRY_LOOP, 'apk add bash') }}

      - name: Setup Dependencies
        if: inputs.image-built != 'true' && inputs.setup-script
        env:
          SETUP_SCRIPT: ${{ inputs.setup-script }}
        run: ${{ format(env.SETUP_RETRY_LOOP, 'eval "$SETUP_SCRIPT"') }}

      - name: Post-setup
        if: inputs.post-setup-script
        env:
          POST_SETUP_SCRIPT: ${{ inputs.post-setup-script }}
        run: eval "$POST_SETUP_SCRIPT"

      - name: Full checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Free up disk space
        uses: ./.github/actions/github-hosted-runner-cleanup
      - name: Fix HOME Directory
        if: ${{ inputs.image-built == 'true' && inputs.container }}
        shell: bash
        run: |
          h=$(getent passwd "$(id -un)" | cut -d: -f6)
          if [ "$h" = "$HOME" ]; then
            echo "HOME fine: $HOME"
            exit 0
          fi
          echo "HOME=$HOME was broken. Setting it to $h"
          ls -ld "$HOME"
          ls -ld "$h"
          echo "USER: $USER"
          echo "id: $(id)"
          echo "HOME=$h" >> "$GITHUB_ENV"

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          install-mode: ${{ inputs.install-mode }}
          image-built: ${{ inputs.image-built }}
          san: ${{ inputs.san }}
          install-script: 'true'
          rust-test-deps: 'true'
          github-token: ${{ github.token }}
          sanitizer-setup: 'true'

      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.artifact-name }}
          # bin.tar.gz + nextest-archive.tar.zst land in the working directory.

      - name: Unpack build artifact
        # Untar instead of relying on the artifact's zip layout so executable
        # bits are preserved (the C/C++ test binaries need to run). The Rust
        # nextest archive is left as-is — `cargo nextest run --archive-file`
        # reads it directly. gzip rather than zstd so we don't need the zstd
        # CLI to be present in the runner image.
        run: |
          set -euo pipefail
          tar -xzf bin.tar.gz
          rm bin.tar.gz
          echo "Restored bin/ size:"
          du -sh bin
          echo "Restored test binaries:"
          find bin -type f -perm -u+x | grep -E '(rstest|test_|bench_)' | head -20 || true
          test -s nextest-archive.tar.zst || { echo "nextest-archive.tar.zst missing"; exit 1; }
          ls -lh nextest-archive.tar.zst

      - name: Verify test binaries present
        # A partial or corrupt artifact must not silently pass: sbin/unit-tests
        # treats missing test directories/binaries as SKIPPED and still exits 0,
        # so without this guard a green unit-test job could report success
        # without having run any native tests. Assert the core C and C++
        # unit-test executables were actually restored before running.
        run: |
          set -euo pipefail
          missing=0
          if ! find bin -type f -perm -u+x -name 'rstest' | grep -q .; then
            echo "::error::C++ unit-test binary 'rstest' not found in restored artifact"
            missing=1
          fi
          if ! find bin -type f -perm -u+x -name 'test_*' | grep -q .; then
            echo "::error::No C unit-test executables ('test_*') found in restored artifact"
            missing=1
          fi
          if [[ $missing -ne 0 ]]; then
            echo "Build artifact is incomplete; refusing to run so a partial artifact cannot report a green unit-test run."
            exit 1
          fi
          echo "Core C and C++ test binaries present."

      - name: Set Artifact Names
        # Used by failure-path log upload below.
        id: artifact-names
        env:
          SAN_LABEL: ${{ inputs.san == 'address' && 'sanitizer' || '' }}
          COV_LABEL: ${{ inputs.coverage && 'coverage test' || '' }}
          PLATFORM: ${{ inputs.container || inputs.env }}
          ARCH: ${{ runner.arch }}
          REDIS_VERSION: ${{ inputs.redis-ref }}
        run: |
          UNIQUE_ID="$RANDOM$RANDOM"
          ARTIFACT_NAME=$(echo "${SAN_LABEL} ${COV_LABEL} ${PLATFORM} ${ARCH} unit - Redis ${REDIS_VERSION} - ${UNIQUE_ID}" | \
                       sed -e 's/[":\/\\<>\|*?]/_/g' -e 's/__*/_/g' -e 's/^_//' -e 's/_$//')
          echo "Artifact name: ${ARTIFACT_NAME}"
          echo "name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

      - name: "C/C++ tests"
        timeout-minutes: ${{ fromJSON(inputs.test-timeout) }}
        id: c_unit_tests
        continue-on-error: ${{ !inputs.fail-fast }}
        env:
          SAN: ${{ inputs.san }}
          LOG: 1
          CLEAR_LOGS: 0
          ENABLE_ASSERT: 1
          # bin/ was restored from the build artifact; skip build.sh's CMake/make step.
          SKIP_BUILD: 1
        run: make unit-tests

      - name: Rust tests
        # Runs the Rust tests from the nextest archive uploaded by task-build.
        # No cargo compilation happens here. MIRI runs in task-build (sanitize
        # variant only) since miri can't archive.
        timeout-minutes: ${{ fromJSON(inputs.test-timeout) }}
        id: rust_unit_tests
        continue-on-error: ${{ !inputs.fail-fast }}
        env:
          SAN: ${{ inputs.san }}
          COV: ${{ inputs.coverage && 1 || 0 }}
          LOG: 1
          CLEAR_LOGS: 0
          ENABLE_ASSERT: 1
          SKIP_BUILD: 1
          RUST_TEST_ARCHIVE_PATH: ${{ github.workspace }}/nextest-archive.tar.zst
        run: make rust-tests-from-archive

      - name: Decode C++ crash stack traces
        if: failure() || steps.c_unit_tests.outcome == 'failure'
        run: |
          chmod +x tests/cpptests/scripts/decode_stacktrace.sh 2>/dev/null || true
          if [[ -x tests/cpptests/scripts/decode_stacktrace.sh ]]; then
            # Find all log files containing stack trace markers and decode them separately
            # Processing each file separately avoids test name cross-contamination between binaries
            find tests -name "*.log" -exec grep -l "=== Caught fatal signal in C++ test" {} \; 2>/dev/null | \
              while read -r logfile; do
                tests/cpptests/scripts/decode_stacktrace.sh "$logfile" || true
              done
          else
            echo "Decode script not found or not executable"
          fi

      - name: Upload Test Logs (failure)
        if: >
          failure() || (
            steps.rust_unit_tests.outcome == 'failure' ||
            steps.c_unit_tests.outcome == 'failure'
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Unit Test Logs ${{ steps.artifact-names.outputs.name }}
          path: |
            tests/**/logs/*.log*
            bin/**/redisearch.so
            bin/**/redisearch.so.debug
          if-no-files-found: ignore

      - name: Collect failed-test-only logs
        # Focused bundle for the PR triage workflow (it downloads
        # "Failed Test Logs *"). The C/C++ CTest summary logs (rstest*.log) are
        # only meaningful when the C/C++ unit tests failed; a Rust-only failure
        # leaves them reporting success, so gate strictly on a C/C++ failure
        # (a Rust failure is surfaced from the job log by triage instead).
        if: ${{ steps.c_unit_tests.outcome == 'failure' }}
        run: |
          set +e
          DEST="failed-test-logs"
          mkdir -p "$DEST"
          find tests -path '*/logs/rstest*.log' -type f 2>/dev/null | while read -r log; do
            mkdir -p "$DEST/$(dirname "$log")"
            cp "$log" "$DEST/$log"
          done
          echo "Failed-test logs bundled: $(find "$DEST" -type f | wc -l)"
          exit 0

      - name: Upload Failed-Only Test Logs
        # Guard kept in lockstep with "Collect failed-test-only logs" above.
        if: ${{ steps.c_unit_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Failed Test Logs ${{ steps.artifact-names.outputs.name }}
          path: failed-test-logs/
          if-no-files-found: ignore

      - name: Fail flow if tests failed
        if: |
          failure() || (
            steps.rust_unit_tests.outcome == 'failure' ||
            steps.c_unit_tests.outcome == 'failure'
          )
        run: |
          echo "C/C++ tests: ${{ steps.c_unit_tests.outcome }}"
          echo "Rust tests: ${{ steps.rust_unit_tests.outcome }}"
          exit 1

      - name: Import Codecov GPG public key
        if: inputs.coverage
        run: gpg --import .github/codecov_gpg.pub
      - name: Upload unit coverage
        if: inputs.coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2 NOSONAR
        with:
          files: bin/unit.info,bin/rust_cov.info
          disable_search: true
          flags: unit
          fail_ci_if_error: ${{ env.IS_FORK_PR != 'true' }}
          token: ${{ secrets.CODECOV_TOKEN }}

  common-flow-mirror:
    if: ${{ inputs.container != '' && inputs.image-built == 'true' && inputs.image-is-mirror == 'true' }}
    name: Unit / mirror
    runs-on: ${{ inputs.env || vars.RUNS_ON || 'ubuntu-latest' }}
    container:
      image: ${{ inputs.image }}
      options: >-
        --user root
        ${{ startsWith(inputs.container, 'alpine:') && '-v /opt/gha-alpine-node:/opt:rw -v /opt/gha-alpine-node:/__e/node20:ro -v /opt/gha-alpine-node:/__e/node24:ro' || '' }}
      credentials:
        username: ${{ vars.GHCR_MIRROR_USERNAME }}
        password: ${{ secrets.GHCR_MIRROR_PASSWORD }}
    permissions: *common_flow_permissions
    env: *common_flow_env
    defaults: *common_flow_defaults
    steps: *common_flow_steps

  common-flow-raw:
    if: ${{ inputs.container != '' && inputs.image-built != 'true' }}
    name: Unit / raw
    runs-on: ${{ inputs.env || vars.RUNS_ON || 'ubuntu-latest' }}
    container:
      image: ${{ inputs.container }}
      options: *common_flow_container_options
    permissions: *common_flow_permissions
    env: *common_flow_env
    defaults: *common_flow_defaults
    steps: *common_flow_steps

  common-flow-host:
    if: ${{ inputs.container == '' }}
    name: Unit / host
    runs-on: ${{ inputs.env || vars.RUNS_ON || 'ubuntu-latest' }}
    permissions: *common_flow_permissions
    env: *common_flow_env
    defaults: *common_flow_defaults
    steps: *common_flow_steps
