name: Temporary live backport validation 11322

# Interface and recovery policy: docs/auto-backport.md
on:
  push:
    branches: [guy-backport-live-run-11322]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: backport-live-11322
  cancel-in-progress: false
  # Preserve explicit comment requests instead of replacing the pending run.
  queue: max

env:
  GH_REPO: ${{ github.repository }}
  BACKPORT_WORK: /tmp/backport-agent-work
  BACKPORT_ACTION_WORK: /tmp/backport-classic-work
  BACKPORT_MANIFEST_FILE: /tmp/backport-agent-manifest.json

jobs:
  backport:
    runs-on: ubuntu-slim
    timeout-minutes: 75
    if: github.actor == 'GuyAv46'
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: guy-backport-live-master-11322
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve request and check write permission
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: issue_comment
          EVENT_ACTION: created
          PR_NUMBER_FROM_PR: ${{ github.event.pull_request.number }}
          PR_NUMBER_FROM_ISSUE: '11323'
          LABEL_NAME: ${{ github.event.label.name }}
          COMMENT_BODY: '/backport 99.1322-clean 99.1322-mixed 99.1322-conflict'
        run: python3 scripts/auto_backport/resolve_create.py

      - name: Generate classic action token
        id: action-token
        if: steps.ctx.outputs.skip == 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_PR_APP_ID }}
          private-key: ${{ secrets.GH_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Deduplicate targets and prepare classic checkout
        id: preflight
        if: steps.ctx.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.action-token.outputs.token }}
          BACKPORT_BOT_LOGIN: ${{ steps.action-token.outputs.app-slug }}[bot]
          BACKPORT_CONTEXT_FILE: ${{ steps.ctx.outputs.context_file }}
        run: python3 scripts/auto_backport/unified.py preflight

      - name: Backport without a model
        id: classic
        if: steps.preflight.outputs.targets != ''
        continue-on-error: true
        uses: korthout/backport-action@2e830a1d0b8269505846ddd407a70876913ad1f8 # v4.6.0
        with:
          github_token: ${{ steps.action-token.outputs.token }}
          github_workspace: ${{ env.BACKPORT_ACTION_WORK }}
          source_pr_number: ${{ steps.ctx.outputs.pr }}
          target_branches: ${{ steps.preflight.outputs.targets }}
          # Targets are resolved once; action label discovery would union them
          # back in and violate explicit comment overrides.
          label_pattern: ''
          branch_name: 'backport-agent/pr-${pull_number}-to-${target_branch}'
          pull_title: '[${target_branch}] ${pull_title}'
          pull_description: |
            Backport of #${pull_number} to `${target_branch}`.
            Merge commit: `${{ steps.ctx.outputs.sha }}`

            ${pull_description}
          merge_commits: skip
          comment_style: summary
          add_author_as_reviewer: true
          auto_merge_enabled: true
          add_labels: auto-backport
          copy_labels_pattern: '^(?!backport |backport-.*-agent$).*'

      - name: Revoke classic token and remove its checkout
        id: revoke
        if: always() && steps.action-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.action-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE /installation/token
          rm -rf "$BACKPORT_ACTION_WORK"

      - name: Collect results and reproduce failures without a model
        id: collect
        if: >-
          !cancelled() && steps.preflight.outcome == 'success' && steps.revoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKPORT_CONTEXT_FILE: ${{ steps.ctx.outputs.context_file }}
          CREATED_PULL_NUMBERS: ${{ steps.classic.outputs.created_pull_numbers }}
          SUCCESS_BY_TARGET: ${{ steps.classic.outputs.was_successful_by_target }}
        run: |
          git config --global user.name 'redis-pr-app[bot]'
          git config --global user.email 'redis-pr-app[bot]@users.noreply.github.com'
          python3 scripts/auto_backport/unified.py collect

      - name: Resolve only conflicting targets with Codex
        id: agent
        if: steps.collect.outputs.run_agent == 'true' && steps.revoke.outcome == 'success'
        timeout-minutes: 35
        continue-on-error: true
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          BACKPORT_CONTEXT_FILE: ${{ steps.collect.outputs.agent_context }}
        with:
          openai-api-key: ${{ secrets.OPEN_AI_BACKPORT_AGENT_KEY }}
          prompt-file: .github/codex/prompts/pr-backport-auto.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-bots: true
          allow-bot-users: github-merge-queue[bot]

      - name: Restore trusted publishing scripts
        id: trusted
        if: always() && steps.ctx.outputs.skip == 'false'
        run: |
          git checkout HEAD -- scripts/auto_backport
          git clean -ffdx scripts/auto_backport

      - name: Generate publication and summary token
        id: publish-token
        if: always() && steps.ctx.outputs.skip == 'false' && steps.trusted.outcome == 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_PR_APP_ID }}
          private-key: ${{ secrets.GH_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Publish prepared backports
        if: >-
          always() && steps.collect.outputs.apply_needed == 'true' && steps.publish-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
          BACKPORT_CONTEXT_FILE: ${{ steps.ctx.outputs.context_file }}
        run: python3 scripts/auto_backport/unified.py apply

      - name: Finalize the single summary comment
        if: always() && steps.ctx.outputs.skip == 'false' && steps.publish-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
          BACKPORT_BOT_LOGIN: ${{ steps.publish-token.outputs.app-slug }}[bot]
          CREATED_PULL_NUMBERS: ${{ steps.classic.outputs.created_pull_numbers }}
          BACKPORT_CONTEXT_FILE: ${{ steps.ctx.outputs.context_file }}
        run: python3 scripts/auto_backport/unified.py report

      - name: Preserve results even if publication fails
        if: always() && steps.ctx.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backport-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backport-results.json
            ${{ runner.temp }}/backport-summary.md
          if-no-files-found: warn
