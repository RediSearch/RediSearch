name: temporary testing

# This file is useful for triggering actions when you implement them.
# When the `branches-ignore` line is commented out, this workflow will run on every push.
# It is better to use this file for testing your new flows than creating a new one, to avoid cluttering the repo
# action tab with unused workflows.
# Don't worry about conflicts with other PRs - there is no "right" content of this file.
# Make sure the `branches-ignore` line is not commented out when you merge your PR.

on:
  push:
    branches: ['sharon-MOD-18890-ci-run']

jobs:

  alpine-test:
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/flow-test.yml
    secrets: inherit
    with:
      platform: alpine:3.23
      redis-ref: unstable
      # Skip C/C++ and Rust unit tests (heavy, unrelated to this investigation) and just
      # run the pytest standalone+coordinator flows that actually exercise
      # test_hybrid_query_with_text_vamana. Keep `rejson` -- lots of unrelated tests
      # (e.g. test_hybrid_json.py) depend on the RedisJSON module being loaded and fail
      # with "unknown command 'JSON.SET'" without it. Drop `fail-fast` so an unrelated
      # failure on one architecture doesn't cancel the other.
      options: standalone,coordinator,rejson
      # Restrict to test_vecsim.py (not the full pytest suite), so iterating doesn't pay
      # for every unrelated test file every push.
      job-test-config: '{"test": "TEST=test_vecsim.py"}'
