name: Redis Build Sanity

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform name (e.g., ubuntu:noble, macos-15, macos-26)'
        type: string
        required: true
      architecture:
        description: 'Architecture (x86_64, aarch64)'
        type: string
        required: true
      redis-repository:
        description: 'Redis repository to use for the modernized build flow'
        type: string
        required: true
      redis-ref:
        description: 'Redis ref containing modules-update/bootstrap/build/run'
        type: string
        required: true
      redisearch-repository:
        description: 'RediSearch repository to inject into Redis modules.yaml'
        type: string
        required: true
      redisearch-ref:
        description: 'RediSearch ref/SHA to inject into Redis modules.yaml'
        type: string
        required: true
      image:
        description: >-
          Stock container image to use instead of the platform's CI image (e.g. a CI image
          that ships a compiler would hide a bootstrap that fails to install one). Empty
          keeps the image from task-get-config.yml.
        type: string
        default: ''
      test-timeout:
        description: 'Timeout in minutes for each of bootstrap and build'
        type: number
        default: 180

env:
  REDISEARCH_CI_SYSTEM_PATH: >-
    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/homebrew/bin:/opt/homebrew/sbin
  SETUP_RETRY_LOOP: |
    SUCCESS=0
    for i in 1 2 3 4 5; do
      echo "Attempt $i of 5"
      if {0}; then
        echo "Setup succeeded"
        SUCCESS=1
        break
      fi
      if [ $i -lt 5 ]; then
        echo "Setup failed, retrying in 30 seconds..."
        sleep 30
      fi
    done
    [ $SUCCESS -eq 1 ] || exit 1

jobs:
  get-config:
    permissions: {} # task-get-config.yml only resolves config values
    name: Get build configurations for platform
    uses: ./.github/workflows/task-get-config.yml
    secrets:
      SECURITY_API_TOKEN: ${{ secrets.SECURITY_API_TOKEN }}
    with:
      platform: ${{ inputs.platform }}
      architecture: ${{ inputs.architecture }}

  start-runner:
    permissions: {} # AWS access keys, and the runner registers with an App token
    needs: get-config
    name: Start self-hosted EC2 runner
    if: ${{ needs.get-config.outputs.ec2_image_id }}
    uses: ./.github/workflows/task-start-ec2-runner.yml
    secrets: inherit
    with:
      ec2-image-id: ${{ needs.get-config.outputs.ec2_image_id }}
      ec2-instance-type: ${{ needs.get-config.outputs.ec2_instance_type }}

  redis-build-sanity:
    needs: [get-config, start-runner]
    name: Redis build sanity on ${{ needs.get-config.outputs.name }}
    if: |
      !cancelled() &&
      needs.get-config.result == 'success' &&
      (!needs.get-config.outputs.ec2_image_id || needs.start-runner.result == 'success')
    runs-on: ${{ needs.get-config.outputs.ec2_image_id && needs.start-runner.outputs.label || needs.get-config.outputs.env || vars.RUNS_ON || 'ubuntu-latest' }}
    # Runner-local env is unavailable while GitHub creates the job container.
    # Use the resolved runner label as the pre-container signal for GitHub-hosted
    # mounts; runner-local env is not available yet.
    container: ${{
      (inputs.image || needs.get-config.outputs.container)
        && fromJSON(
          format('{{"image":"{0}","options":"--user root {1} {2}"}}',
            inputs.image || needs.get-config.outputs.container,
            startsWith(needs.get-config.outputs.container, 'alpine:') && (startsWith(needs.get-config.outputs.env || vars.RUNS_ON || 'ubuntu-latest', 'ubuntu') && '-v /opt:/opt:rw,rshared -v /opt:/__e/node20:ro,rshared -v /opt:/__e/node24:ro,rshared' || '-v /opt/gha-alpine-node:/opt:rw -v /opt/gha-alpine-node:/__e/node20:ro -v /opt/gha-alpine-node:/__e/node24:ro') || '',
            startsWith(needs.get-config.outputs.env || vars.RUNS_ON || 'ubuntu-latest', 'ubuntu') && '-v /usr/share/dotnet:/host/usr/share/dotnet -v /usr/local/lib/android:/host/usr/local/lib/android -v /opt/ghc:/host/opt/ghc -v /opt/hostedtoolcache:/host/opt/hostedtoolcache' || '')
        )
      || null }}
    permissions:
      contents: read
    timeout-minutes: 420
    defaults:
      run:
        shell: /bin/bash -l -eo pipefail {0}
    env:
      # GCC 12 (bookworm) has false positives inside its own avx512fintrin.h which
      # VectorSimilarity's -Werror turns fatal. Same flags as redis's modules-build-flow.yml,
      # job-level so they also reach redisearch's own cmake re-drive.
      CXXFLAGS: -Wno-error=uninitialized -Wno-error=maybe-uninitialized -Wno-unknown-warning-option
    steps:
      - name: Install bash
        if: startsWith(needs.get-config.outputs.container, 'alpine:')
        shell: sh -l -eo pipefail {0}
        run: ${{ format(env.SETUP_RETRY_LOOP, 'apk add bash') }}

      - name: Setup platform dependencies
        if: needs.get-config.outputs.setup_script
        uses: redislabsdev/redisearch-ci-common/.github/actions/retry-command@v1
        with:
          command: ${{ needs.get-config.outputs.setup_script }}

      - name: Post-setup
        if: needs.get-config.outputs.post_setup_script
        env:
          POST_SETUP_SCRIPT: ${{ needs.get-config.outputs.post_setup_script }}
        run: ${{ needs.get-config.outputs.post_setup_script }}

      - name: Checkout RediSearch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure Tracebit canary credentials
        uses: ./.github/actions/tracebit-container
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN }}

      - name: Free up disk space
        uses: ./.github/actions/github-hosted-runner-cleanup

      - name: Disable automatic apt updates (self-hosted Linux)
        if: ${{ needs.get-config.outputs.ec2_image_id && !needs.get-config.outputs.container && !contains(needs.get-config.outputs.env, 'macos') }}
        run: |
          echo "Disabling apt auto-update services on self-hosted runner..."
          sudo systemctl stop apt-daily.timer apt-daily.service apt-daily-upgrade.timer apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo systemctl disable apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
          sudo systemctl mask apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo pkill -f "apt.systemd.daily" || true
          sudo pkill -f "unattended-upgrade" || true

      - name: Install Redis build-flow prerequisites
        env:
          INSTALL_MODE: ${{ needs.get-config.outputs.install_mode }}
        run: |
          run_pkg() {
            if [ -n "$INSTALL_MODE" ]; then
              $INSTALL_MODE "$@"
            else
              "$@"
            fi
          }

          ensure_curl() {
            command -v curl >/dev/null 2>&1 && return 0

            if command -v dnf >/dev/null 2>&1; then
              run_pkg dnf install -y curl-minimal || run_pkg dnf install -y curl
            elif command -v yum >/dev/null 2>&1; then
              run_pkg yum install -y curl
            elif command -v tdnf >/dev/null 2>&1; then
              run_pkg tdnf install -y --noplugins curl
            elif command -v apk >/dev/null 2>&1; then
              run_pkg apk add --no-cache curl
            elif command -v apt-get >/dev/null 2>&1; then
              run_pkg apt-get install -y --no-install-recommends curl
            fi

            command -v curl >/dev/null 2>&1
          }

          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            run_pkg apt-get update
            run_pkg apt-get install -y --no-install-recommends bash ca-certificates curl findutils gawk git make libssl-dev openssl
          elif command -v dnf >/dev/null 2>&1; then
            run_pkg dnf install -y bash ca-certificates findutils gawk git gzip make tar openssl-devel openssl
          elif command -v yum >/dev/null 2>&1; then
            run_pkg yum install -y bash ca-certificates findutils gawk git gzip make tar openssl-devel openssl
          elif command -v apk >/dev/null 2>&1; then
            run_pkg apk add --no-cache bash ca-certificates curl findutils gawk git make openssl-dev openssl tar
          elif command -v tdnf >/dev/null 2>&1; then
            run_pkg tdnf install -y --noplugins bash ca-certificates findutils gawk git gzip make tar openssl-devel openssl
          elif command -v brew >/dev/null 2>&1; then
            brew list git >/dev/null 2>&1 || brew install git
          fi

          ensure_curl
          git config --global --add safe.directory '*'
          # Module bootstraps skip their venv setup when /.dockerenv exists (they assume
          # their own prebuilt Dockerfile image); redis's flow drops it for the same reason.
          rm -f /.dockerenv

      - name: Checkout Redis
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.redis-repository }}
          ref: ${{ inputs.redis-ref }}
          path: redis

      - name: Configure GitHub token for module clone
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Create CI Redis manifest for this RediSearch ref
        working-directory: redis
        env:
          MANIFEST_FILE: ${{ github.workspace }}/redis/modules/modules-ci.yaml
          REDISEARCH_REPOSITORY: ${{ inputs.redisearch-repository }}
          REDISEARCH_REF: ${{ inputs.redisearch-ref }}
        run: |
          test -f modules/modules.yaml
          # Redis uses this manifest to determine which module SHA to clone.
          # Keep the checkout clean and point CI at a patched manifest copy.
          cp modules/modules.yaml "$MANIFEST_FILE"
          repo_url="https://github.com/${REDISEARCH_REPOSITORY}.git"
          tmp="$(mktemp)"
          awk -v repo="$repo_url" -v ref="$REDISEARCH_REF" '
            /^[[:space:]]*-[[:space:]]*name:[[:space:]]*/ {
              in_redisearch = ($0 ~ /^[[:space:]]*-[[:space:]]*name:[[:space:]]*redisearch[[:space:]]*$/)
            }
            in_redisearch && /^[[:space:]]+repo:[[:space:]]*/ {
              print "    repo: " repo
              next
            }
            in_redisearch && /^[[:space:]]+ref:[[:space:]]*/ {
              print "    ref: " ref
              next
            }
            { print }
          ' "$MANIFEST_FILE" > "$tmp"
          mv "$tmp" "$MANIFEST_FILE"
          awk '
            /^[[:space:]]*-[[:space:]]*name:[[:space:]]*redisearch[[:space:]]*$/ { show = 1; count = 0 }
            show && count < 5 { print; count++ }
            show && count >= 5 { show = 0 }
          ' "$MANIFEST_FILE"

      # Mirror redis/redis's modules-build-flow.yml: every module, not just redisearch.
      # Scoping to redisearch hid a regression where another module's bootstrap (its
      # `dnf update`) upgraded clang 21 to 22 after redisearch's bootstrap had installed it.
      - name: Run make modules-update
        timeout-minutes: ${{ inputs.test-timeout }}
        working-directory: redis
        env:
          MODULES_MANIFEST_FILE: ${{ github.workspace }}/redis/modules/modules-ci.yaml
        run: |
          export PATH="${PATH:-}:$REDISEARCH_CI_SYSTEM_PATH"
          make modules-update

      # Bootstrap may install toolchains and persist them through GITHUB_PATH/GITHUB_ENV.
      # Keep build in a later step so those updates are visible.
      - name: Run make bootstrap
        timeout-minutes: ${{ inputs.test-timeout }}
        env:
          MODULES_MANIFEST_FILE: ${{ github.workspace }}/redis/modules/modules-ci.yaml
        # Bootstrap installs every dependency over the network, and
        # install_script.sh is re-runnable, so retry it as a whole.
        uses: redislabsdev/redisearch-ci-common/.github/actions/retry-command@v1
        with:
          working_directory: redis
          command: PATH="${PATH:-}:$REDISEARCH_CI_SYSTEM_PATH" make bootstrap

      # LTO and the other redisearch build settings come from build_env in Redis's
      # modules.yaml (the same thing a redis user builds with), not from this repository's
      # per-platform enable_lto.
      - name: Run make all BUILD_TLS=yes
        timeout-minutes: ${{ inputs.test-timeout }}
        working-directory: redis
        env:
          MODULES_MANIFEST_FILE: ${{ github.workspace }}/redis/modules/modules-ci.yaml
        run: |
          export PATH="${PATH:-}:$REDISEARCH_CI_SYSTEM_PATH"
          jobs="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN)"
          make -j"$jobs" all BUILD_TLS=yes

      - name: Run redis-server with redis-full.conf and verify MODULE LIST
        working-directory: redis
        env:
          MODULES_MANIFEST_FILE: ${{ github.workspace }}/redis/modules/modules-ci.yaml
        run: |
          export PATH="${PATH:-}:$REDISEARCH_CI_SYSTEM_PATH"
          port=$((20000 + RANDOM % 20000))
          ./src/redis-server redis-full.conf --daemonize no --port "$port" --bind 127.0.0.1 \
            --save '' --appendonly no --protected-mode no &
          server_pid=$!
          cli="./src/redis-cli -h 127.0.0.1 -p $port"
          trap '$cli shutdown nosave >/dev/null 2>&1 || kill "$server_pid" 2>/dev/null || true' EXIT
          i=0
          until $cli ping 2>/dev/null | grep -q PONG; do
            i=$((i+1))
            if [ "$i" -gt 60 ] || ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'redis-server did not come up'
              exit 1
            fi
            sleep 1
          done
          $cli MODULE LIST | tee module-list.txt
          for m in bf search ReJSON timeseries; do
            grep -qx "$m" module-list.txt || { echo "MISSING MODULE: $m"; exit 1; }
          done
          # A loaded module can still have failed to register its commands.
          $cli --raw COMMAND INFO FT.SEARCH | grep -qi 'ft.search' || { echo 'FT.SEARCH not registered'; exit 1; }

  stop-runner:
    permissions: {} # AWS access keys, and the runner deregisters with an App token
    name: Stop self-hosted EC2 runner
    needs: [start-runner, redis-build-sanity]
    if: ${{ always() && needs.start-runner.outputs.ec2-instance-id != '' }}
    uses: ./.github/workflows/task-stop-ec2-runner.yml
    secrets: inherit
    with:
      label: ${{ needs.start-runner.outputs.label }}
      ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
