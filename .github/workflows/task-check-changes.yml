on:
  workflow_call:
    outputs:
      CODE_CHANGED:
        description: "Indicates if code has been modified"
        value: ${{ jobs.change-checks.outputs.CODE_CHANGED }}
      BENCHMARK_CHANGED:
        description: "Indicates if code or benchmark-related files were modified"
        value: ${{ jobs.change-checks.outputs.BENCHMARK_CHANGED }}
      RUST_CODE_CHANGED:
        description: "Indicates if Rust code files were modified"
        value: ${{ jobs.change-checks.outputs.RUST_CODE_CHANGED }}
      TESTS_CHANGED:
        description: "Indicates if tests were modified"
        value: ${{ jobs.change-checks.outputs.TESTS_CHANGED }}
      ONLY_CPP_TESTS_CHANGED:
        description: >-
          Indicates the change set is confined to tests/cpptests/** -- no other code,
          workflow, or test file changed (tests/ctests/** does NOT count: it holds
          fixtures Python flow tests load too). Safe signal to skip flow tests.
        value: ${{ jobs.change-checks.outputs.ONLY_CPP_TESTS_CHANGED }}
      ONLY_PY_TESTS_CHANGED:
        description: >-
          Indicates the change set is confined to tests/pytests/** -- no other code,
          workflow, or test file changed. Safe signal to skip unit tests.
        value: ${{ jobs.change-checks.outputs.ONLY_PY_TESTS_CHANGED }}

jobs:
  change-checks:
    runs-on: ubuntu-slim
    outputs: # Make sure to return "true" if any workflow was changed, to make sure the workflow works
      CODE_CHANGED: ${{ steps.check-code.outputs.any_modified == 'true' || steps.check-cmake.outputs.any_modified == 'true' || steps.check-workflows.outputs.any_modified == 'true' }}
      BENCHMARK_CHANGED: ${{ steps.check-code.outputs.any_modified == 'true' || steps.check-cmake.outputs.any_modified == 'true' || steps.check-benchmarks.outputs.any_modified == 'true' || steps.check-workflows.outputs.any_modified == 'true' }}
      RUST_CODE_CHANGED: ${{ steps.check-micro-benchmarks.outputs.any_modified == 'true' || steps.check-rust-cmake.outputs.any_modified == 'true' || steps.check-workflows.outputs.any_modified == 'true' }}
      TESTS_CHANGED: ${{ steps.check-tests.outputs.any_modified == 'true' || steps.check-workflows.outputs.any_modified == 'true' }}
      # "Only this category changed" is deliberately conservative: it requires the rest of the
      # tree (code, workflows, and every other test directory -- ctests/ (shared fixtures),
      # qa/, memcheck/, deps/, an unrecognized new tests/ subdir) to be untouched. Anything
      # ambiguous falls through to false on both, which callers treat as "run everything",
      # never as "run nothing".
      ONLY_CPP_TESTS_CHANGED: >-
        ${{
          steps.check-cpp-tests.outputs.any_modified == 'true' &&
          steps.check-py-tests.outputs.any_modified != 'true' &&
          steps.check-other-tests.outputs.any_modified != 'true' &&
          steps.check-code.outputs.any_modified != 'true' &&
          steps.check-cmake.outputs.any_modified != 'true' &&
          steps.check-workflows.outputs.any_modified != 'true'
        }}
      ONLY_PY_TESTS_CHANGED: >-
        ${{
          steps.check-py-tests.outputs.any_modified == 'true' &&
          steps.check-cpp-tests.outputs.any_modified != 'true' &&
          steps.check-other-tests.outputs.any_modified != 'true' &&
          steps.check-code.outputs.any_modified != 'true' &&
          steps.check-cmake.outputs.any_modified != 'true' &&
          steps.check-workflows.outputs.any_modified != 'true'
        }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # required for changed-files action to work

      - name: Check if any workflows were changed
        id: check-workflows
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with: # Only run on changes to these paths (workflows)
          files: |
                .github/workflows/**
                .github/actions/**
      - name: Check if code was changed
        id: check-code
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
                *
                .*
                src/**
                deps/**
                build/**
                cmake/**
                srcutil/**
                sbin/**
                scripts/**
                pack/**
                .install/**
                .codespell/**
                .devcontainer/**
          files_ignore: |
                .github/**
                .skills/**
                **/.skills/**
                **/.claude/**
                docs/**
                tests/**
                **/*.md
                **/*.markdown
                **/*.txt
                **/README
                **/LICENSE
                **/NOTICE
                **/CHANGELOG
                **/*.adoc
                **/*.rst
                **/*.svg
                **/*.png
                **/*.jpg
                **/*.jpeg
                **/*.gif
                **/*.webp
                **/*.ico
                **/*.pdf
          fetch_additional_submodule_history: true
      - name: Check if CMake files were changed
        id: check-cmake
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
                **/CMakeLists.txt
      - name: Check if benchmark files were changed
        id: check-benchmarks
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
                tests/benchmarks/**
                .github/workflows/benchmark-*.yml
          fetch_additional_submodule_history: true
      - name: Check if tests were changed
        id: check-tests
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with: # Only run on changes to these paths (tests related changes)
          files: |
                tests/**
                .github/workflows/*test*.yml
          fetch_additional_submodule_history: true
      - name: Check if C/C++ unit test files were changed
        id: check-cpp-tests
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with: # Deliberately NOT tests/ctests/**: it holds fixtures (genesis.txt,
              # cn_sample.txt, ext-example/) that Python flow tests load too, e.g.
              # test_summarize.py/test_cn.py/test_ext.py -- a change confined to
              # tests/ctests/** must fall through to check-other-tests below instead,
              # so it can't be misclassified as C/C++-only and skip the flow suites.
          files: |
                tests/cpptests/**
      - name: Check if Python flow test files were changed
        id: check-py-tests
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
                tests/pytests/**
      - name: Check if any other test files were changed
        id: check-other-tests
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with: # Anything under tests/** not already classified above -- forces a full run.
              # Includes tests/ctests/**, on purpose (see check-cpp-tests above).
          files: |
                tests/**
          files_ignore: |
                tests/cpptests/**
                tests/pytests/**
                tests/benchmarks/**
          fetch_additional_submodule_history: true
      - name: Check if rust micro-benchmarks were changed
        id: check-micro-benchmarks
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with: # Only run on changes to these paths (redisearch_rs)
          files: |
              src/redisearch_rs/**
          files_ignore: |
              **/.skills/**
              **/.claude/**
              **/*.md
              **/*.markdown
              **/README
              **/LICENSE
              **/NOTICE
              **/CHANGELOG
              **/*.adoc
              **/*.rst
              **/*.svg
              **/*.png
              **/*.jpg
              **/*.jpeg
              **/*.gif
              **/*.webp
              **/*.ico
              **/*.pdf
      - name: Check if Rust CMake files were changed
        id: check-rust-cmake
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
              src/redisearch_rs/CMakeLists.txt
