on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string
      instance-type:
        required: true
        type: string
      ami-id:
        required: true
        type: string

env:
  TAGS: | # Make sure there is no trailing comma!
    [
      {"Key": "Name",         "Value": "redisearch-ci-runner"},
      {"Key": "Environment",  "Value": "CI"},
      {"Key": "Run ID",       "Value": "${{ github.run_id }}"},
      {"Key": "PR",           "Value": "${{ github.event.number }}"},
      {"Key": "Project",      "Value": "${{ github.repository }}"},
      {"Key": "Context",      "Value": "micro-benchmarks"}
    ]

jobs:
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      runner_label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2_instance_id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.PERFORMANCE_EC2_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.PERFORMANCE_EC2_SECRET_KEY }}
          aws-region: ${{ secrets.PERFORMANCE_EC2_AWS_REGION }}
      - name: Generate GitHub App token
        id: generate-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_PR_APP_ID }}
          private-key: ${{ secrets.GH_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
      - name: Prepare EC2 ownership tags
        id: ec2-tags
        # Keep the original workflow actor as owner, including on reruns.
        env:
          OWNER_HANDLE: ${{ github.actor }}
        shell: python
        run: |
          import json
          import os
          import re

          owner = os.environ["OWNER_HANDLE"].lower()
          owner = re.sub(r"[^a-z0-9_]", "_", owner)
          owner = re.sub(r"_+", "_", owner)[:63].strip("_")
          if not owner:
              raise SystemExit("Cannot derive an EC2 owner tag from github.actor")

          tags = json.loads(os.environ["TAGS"])
          tags.extend([
              {"Key": "owner", "Value": owner},
              {"Key": "team", "Value": "rqe"},
          ])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tags={json.dumps(tags)}\n")
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: start
          github-token: ${{ steps.generate-app-token.outputs.token }}
          ec2-image-id: ${{ inputs.ami-id }}
          ec2-instance-type: ${{ inputs.instance-type }}
          subnet-id: ${{ secrets.AWS_EC2_SUBNET_ID_BENCHMARK }}
          security-group-id: ${{ secrets.AWS_EC2_SG_ID_BENCHMARK }}
          aws-resource-tags: ${{ steps.ec2-tags.outputs.tags }}

  micro-benchmark:
    name: Run micro-benchmarks on runner
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.runner_label }}
    permissions:
      contents: read  # actions/checkout
      id-token: write # OIDC role assumption for sccache S3
    env:
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Verify pre-checkout APT lock contention
        timeout-minutes: 20
        run: |
          sudo python3 - <<'PYTHON'
          import fcntl
          import os
          import subprocess
          import threading
          import time

          original = "sudo apt-get update && sudo apt-get -y --no-install-recommends install git"
          patched = "sudo apt-get update && sudo apt-get -o DPkg::Lock::Timeout=600 -y --no-install-recommends install git"
          lock_path = "/var/lib/dpkg/lock-frontend"
          with open(lock_path, "r+") as lock:
              deadline = time.monotonic() + 600
              while True:
                  try:
                      fcntl.lockf(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                      break
                  except BlockingIOError:
                      if time.monotonic() >= deadline:
                          raise RuntimeError("Existing package transaction exceeded 600 seconds")
                      time.sleep(1)
              print(f"CONTROL: POSIX frontend lock held by validation process {os.getpid()}", flush=True)
              try:
                  old = subprocess.run(["bash", "-c", original], text=True,
                                       stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
                  print(old.stdout, flush=True)
                  assert old.returncode == 100, f"Original command returned {old.returncode}"
                  assert lock_path in old.stdout and f"process {os.getpid()}" in old.stdout
                  print("ORIGINAL: exit 100 because validation process holds frontend lock", flush=True)

                  waiting = threading.Event()
                  captured = []
                  new = subprocess.Popen(["bash", "-c", patched], text=True,
                                         stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  def read_output():
                      recent = ""
                      while True:
                          char = new.stdout.read(1)
                          if not char:
                              return
                          captured.append(char)
                          recent = (recent + char)[-256:]
                          if "Waiting for cache lock" in recent:
                              waiting.set()
                  reader = threading.Thread(target=read_output, daemon=True)
                  reader.start()
                  observed_wait = waiting.wait(180)
                  print(f"PATCHED: waiting observed while POSIX lock held: {observed_wait}", flush=True)
              finally:
                  fcntl.lockf(lock, fcntl.LOCK_UN)
                  print("CONTROL: released POSIX frontend lock", flush=True)

              result = new.wait(timeout=180)
              reader.join(timeout=10)
              print("".join(captured), flush=True)
              assert observed_wait, "Patched command did not report waiting while lock was held"
              assert not reader.is_alive(), "Output collection did not finish"
              assert result == 0, f"Patched command returned {result}"
              print("PATCHED: waited for lock release and exited 0", flush=True)
          PYTHON
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Confirm checkout
        run: git rev-parse HEAD

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner # required to get output from the start-runner job
      - micro-benchmark # required to wait when the main job is done
    runs-on: ubuntu-latest
    if: ${{ always() }} # required to stop the runner even if the error happened in the previous jobs
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.PERFORMANCE_EC2_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.PERFORMANCE_EC2_SECRET_KEY }}
          aws-region: ${{ secrets.PERFORMANCE_EC2_AWS_REGION }}
      - name: Generate GitHub App token
        id: generate-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_PR_APP_ID }}
          private-key: ${{ secrets.GH_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ steps.generate-app-token.outputs.token }}
          label: ${{ needs.start-runner.outputs.runner_label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2_instance_id }}
