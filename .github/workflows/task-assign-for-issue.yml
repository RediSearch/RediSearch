name: Assigns the One in Shift for a New Issue

# Documentation: https://redislabs.atlassian.net/wiki/spaces/DX/pages/3967844669/RediSearch+CI+refactor

on:
  issues:
    types: [opened, reopened]

jobs:
  Assign:
    permissions: # gh issue edit --add-assignee
      issues: write
    if: ${{ !contains(github.event.issue.labels.*.name, 'feature') }}
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Configure Tracebit canary credentials
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Assign
        run: gh issue edit ${{ github.event.issue.number }} --add-assignee ${{ vars.ISSUES_SHIFT_ASSIGNEE }} -R ${{ env.GITHUB_REPOSITORY }}
