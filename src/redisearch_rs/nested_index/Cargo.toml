[package]
name = "nested_index"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
# Enabled when building tests so `build.rs` links the C code (`libredisearch_c_bundle`).
# See https://github.com/rust-lang/cargo/issues/4789#issuecomment-2308131243
unittest = []

[lints]
workspace = true

[build-dependencies]
build_utils.workspace = true

[dependencies]
compound_index.workspace = true
numeric_range_tree.workspace = true
rqe_core.workspace = true
tag_index.workspace = true
thiserror.workspace = true
workspace_hack.workspace = true

[dev-dependencies]
# `unittest` runs the tree's own delta and invariant checks on every add.
numeric_range_tree = { workspace = true, features = ["unittest"] }
tag_index = { workspace = true, features = ["test-utils"] }
nested_index = { path = ".", features = ["unittest"] }
redis_mock.workspace = true

# Crate required to invoke C symbols: its `#[used]` symbol table keeps the Rust FFI
# functions that the linked C code calls back into, so they aren't stripped from the
# test binary.
redisearch_rs = { path = "../c_entrypoint/redisearch_rs", features = ["mock_allocator"] }
