[package]
name = "geo_ffi"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
# This crate has no unit tests or benches.
# Compiling a no-op bench/test binary can cause linking issues with C.
test = false
bench = false

[features]
unittest = []

[build-dependencies]
build_utils.workspace = true

[dependencies]
cheadergen.workspace = true
decorum.workspace = true
ffi.workspace = true
geo.workspace = true
query_error.workspace = true
redis-module.workspace = true
rqe_core.workspace = true
rqe_iterators.workspace = true
tracing.workspace = true
tracing_log_error.workspace = true
workspace_hack.workspace = true

[dev-dependencies]
geo_ffi = { path = ".", features = ["unittest"] }
redis_mock.workspace = true
redisearch_rs = { workspace = true, features = ["mock_allocator"] }

[lints]
workspace = true
