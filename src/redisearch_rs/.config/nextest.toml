[profile.default]
slow-timeout = { period = "2s", terminate-after = 8 }
leak-timeout = "500ms"
fail-fast = false
# Retries only kick in on an actual failure/timeout — a test that times out
# under transient runner contention (CI-observed on the `intel` self-hosted
# runner) gets one more chance instead of failing the whole periodic run;
# a genuinely hung test still fails after the retry is exhausted.
retries = 1

[profile.default-miri]
# `miri` is a _lot_ slower.
slow-timeout = { period = "10s", terminate-after = 4 }
fail-fast = false
