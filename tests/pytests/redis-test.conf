# redis-server config for every server the pytest suite starts (see runtests.sh).

# An unreachable save point instead of Redis's defaults: automatic snapshots otherwise take
# Redis's single child slot from the fork GC. Not `save ""`, because the final snapshot on
# SIGTERM only happens while a save point is configured and RLTest's restart-based reload
# needs it.
save 86400 1000000000

# Redis now refuses to start a cluster-bus port that isn't TLS-authenticated (MOD-18503's
# pinned Redis dependency picked this up from an upstream `unstable` merge). RLTest's cluster
# tests use a plain-TCP bus, so waive the protection here -- the bus is only reachable on the
# CI runner's loopback/private network, never a hostile one. Has no effect outside cluster
# mode, so it's harmless for the standalone suite too.
cluster-bus-port-protected-mode no
