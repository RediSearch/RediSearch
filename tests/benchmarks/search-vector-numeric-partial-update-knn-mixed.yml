version: 0.5
name: "search-vector-numeric-partial-update-knn-mixed"
description: "
             KNN queries alongside numeric-only updates, over documents that carry
             both fields (MOD-17749). The update-only companion is
             search-vector-numeric-partial-update.

             Queries run on the primary client while a rate-limited background client
             rewrites the numeric field of randomly chosen documents over the same window
             (99875 updates; the keys are uniform random, so about 63% of the documents
             are hit, some more than once). An update-only run
             cannot show what the moves cost a concurrent reader -- which is the number
             that decides whether moving an entry is cheaper than deleting and
             re-adding it in practice, not just in the update's own latency.

             The query is the one vecsim-arxiv-titles-384-angular-filters-m16-ef-128-numeric-filter
             runs, unchanged, so its latency here can be read against that benchmark's
             steady-state figure for the same corpus.
             Specifically for this testcase:
                - Type (read/write/mixed): mixed
                - Query type: KNN with a numeric pre-filter
                - Query sample: '(@update_date_ts:[-inf (1484298946] @update_date_ts:[(1399908937 +inf])=>[KNN 25 @vector $vec_param EF_RUNTIME 64 AS vector_score]'
             "
metadata:
  component: "search"

timeout_seconds: 1800
setups:
  - oss-standalone
  - oss-standalone-threads-6

dbconfig:
  dataset_name: "arxiv-titles-384-angular-filters-m16-ef-128"
  dataset: "https://s3.amazonaws.com/benchmarks.redislabs/redisearch/internal.tasks/arxiv-titles-384-angular-filters-m16-ef-128/arxiv-titles-384-angular-filters-m16-ef-128-dump.rdb"
  dataset_load_timeout_secs: 1000
  check:
    keyspacelen: 100000

clientconfig:
  benchmark_type: "mixed"
  tool: memtier_benchmark
  arguments: "--test-time 180 -c 16 -t 4 --hide-histogram --command 'FT.SEARCH idx \"(@update_date_ts:[-inf (1484298946] @update_date_ts:[(1399908937 +inf])=>[KNN 25 @vector $vec_param EF_RUNTIME 64 AS vector_score]\" TIMEOUT 90000 RETURN 1 vector_score SORTBY vector_score DESC DIALECT 2 LIMIT 0 25 params 2 vec_param ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????'"

# The updates run as a bounded background client, so the primary client above measures
# queries only and its report carries no update traffic.
# Keys are bare integers, and [125, 99999] is the corpus' one gap-free run -- 99875 of
# its 100000 documents. Every write therefore lands on a document that already exists:
# a range with gaps would create new ones, and an insert is exactly what this benchmark
# exists to show does not happen.
# The keys are picked uniformly at random (memtier's default key pattern), so 99875 writes
# cover about 63% of that range and some documents are rewritten more than once.
# 99875 requests at 555/s span the ~180s the primary runs. They must finish within its
# --test-time: the runner waits for both clients and warns if the background one outlives it.
background_clientconfig:
  tool: memtier_benchmark
  arguments: "-c 1 -t 1 --requests 99875 --rate-limiting 555 --key-prefix '' --key-minimum 125 --key-maximum 99999 --command 'HSET __key__ update_date_ts 1450000000'"
