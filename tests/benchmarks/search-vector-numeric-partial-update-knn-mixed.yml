version: 0.5
name: "search-vector-numeric-partial-update-knn-mixed"
description: "
             KNN queries alongside numeric-only updates, over documents that carry
             both fields (MOD-17749). The update-only companion is
             search-vector-numeric-partial-update.

             Queries run on the primary client for 200s while a background client sends
             99875 updates that rewrite the numeric field of randomly chosen documents, as
             fast as the server takes them (the keys are uniform random, so about 63% of
             the documents are hit, some more than once). An update-only run
             cannot show what the moves cost a concurrent reader -- which is the number
             that decides whether moving an entry is cheaper than deleting and
             re-adding it in practice, not just in the update's own latency.

             The query is the one vecsim-arxiv-titles-384-angular-filters-m16-ef-128-numeric-filter
             runs, unchanged, so its latency here can be read against that benchmark's
             steady-state figure for the same corpus.

             The number of updates is fixed, so it is the same for every build, and the
             window is long enough for the background client to finish inside it. The
             runner discards that client's output, so whether all the updates were sent
             is read from the server: the HSET calls in info_metrics below should be 99875.
             Specifically for this testcase:
                - Type (read/write/mixed): mixed
                - Query type: KNN with a numeric pre-filter
                - Query sample: '(@update_date_ts:[-inf (1484298946] @update_date_ts:[(1399908937 +inf])=>[KNN 25 @vector $vec_param EF_RUNTIME 64 AS vector_score]'
             "
metadata:
  component: "search"

timeout_seconds: 1800
setups:
  - oss-standalone
  - oss-standalone-threads-6

dbconfig:
  dataset_name: "arxiv-titles-384-angular-filters-m16-ef-128"
  dataset: "https://s3.amazonaws.com/benchmarks.redislabs/redisearch/internal.tasks/arxiv-titles-384-angular-filters-m16-ef-128/arxiv-titles-384-angular-filters-m16-ef-128-dump.rdb"
  dataset_load_timeout_secs: 1000
  check:
    keyspacelen: 100000

# The runner discards the background client's output, so the updates are counted on the server:
# every update is one HSET. A redisbench-admin without info_metrics ignores this block.
info_metrics:
  - section: commandstats
    fields:
      - cmdstat_hset
  - section: search_garbage_collector
    fields:
      - search_gc_total_cycles
      - search_gc_total_ms_run

clientconfig:
  benchmark_type: "mixed"
  tool: memtier_benchmark
  arguments: "--test-time 200 -c 16 -t 4 --hide-histogram --command 'FT.SEARCH idx \"(@update_date_ts:[-inf (1484298946] @update_date_ts:[(1399908937 +inf])=>[KNN 25 @vector $vec_param EF_RUNTIME 64 AS vector_score]\" TIMEOUT 90000 RETURN 1 vector_score SORTBY vector_score DESC DIALECT 2 LIMIT 0 25 params 2 vec_param ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????'"

# The updates run as a bounded background client, so the primary client above measures
# queries only and its report carries no update traffic.
# Keys are bare integers, and [125, 99999] is the corpus' one gap-free run -- 99875 of
# its 100000 documents. Every write therefore lands on a document that already exists:
# a range with gaps would create new ones, and an insert is exactly what this benchmark
# exists to show does not happen.
# The keys are picked uniformly at random (memtier's default key pattern), so 99875 writes
# cover about 63% of that range and some documents are rewritten more than once.
# The background client has no rate limit: it sends its 99875 requests one at a time, as fast
# as the server answers. Next to the queries each update takes about 2 ms, so on a developer
# machine that took 213 seconds with the vector-only optimization on and 241 with it off, more
# than the 180 seconds the primary used to run; the primary runs 200 now. If the background
# client outlives the primary the runner waits for it and warns; the commandstats below show how
# many updates the server received.
background_clientconfig:
  tool: memtier_benchmark
  arguments: "-c 1 -t 1 --requests 99875 --key-prefix '' --key-minimum 125 --key-maximum 99999 --command 'HSET __key__ update_date_ts 1450000000'"
