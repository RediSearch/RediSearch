version: 0.5
name: "search-vector-numeric-partial-update-knn-5050"
description: "
             KNN queries and numeric-only updates from one client, half and half, over
             documents that carry both fields (MOD-17749). The update-only companion is
             search-vector-numeric-partial-update, the other mixed variant is
             search-vector-numeric-partial-update-knn-mixed, where a background client
             sends the updates.

             A single memtier client sends the query and the update commands in the same
             connections, in equal numbers (the ratio is 4 queries : 4 updates, the four
             updates being the four timestamps the update-only benchmark rewrites). The
             keys of the updates are uniform random, so every update lands on a document
             that already exists. There is no background client, so every update is
             counted in the report, and the queries and the updates share the same
             connections: an update that is slow delays the next query on its connection,
             and the other way around.

             The report has a row per command type, so the p95 and p99 latency of the
             queries, and of the updates, can be compared with those of the same type in
             another build, as well as the number of operations of each type.

             The query is the one vecsim-arxiv-titles-384-angular-filters-m16-ef-128-numeric-filter
             runs, unchanged.
             Specifically for this testcase:
                - Type (read/write/mixed): mixed
                - Query type: KNN with a numeric pre-filter
                - Query sample: '(@update_date_ts:[-inf (1484298946] @update_date_ts:[(1399908937 +inf])=>[KNN 25 @vector $vec_param EF_RUNTIME 64 AS vector_score]'
             "
metadata:
  component: "search"

timeout_seconds: 1800
setups:
  - oss-standalone
  - oss-standalone-threads-6

dbconfig:
  dataset_name: "arxiv-titles-384-angular-filters-m16-ef-128"
  dataset: "https://s3.amazonaws.com/benchmarks.redislabs/redisearch/internal.tasks/arxiv-titles-384-angular-filters-m16-ef-128/arxiv-titles-384-angular-filters-m16-ef-128-dump.rdb"
  dataset_load_timeout_secs: 1000
  check:
    keyspacelen: 100000

clientconfig:
  benchmark_type: "mixed"
  tool: memtier_benchmark
  # One client, no background client. The keys are bare integers and [125, 99999] is the
  # corpus' one gap-free run, so every update hits an existing document: a range with gaps
  # would create new ones, and an insert is exactly what this benchmark exists to show does
  # not happen. Four timestamps rather than one, spread across the range the dataset's own
  # filters use, so the numeric index is really touched. The ratio 4 for the query against
  # 1 for each of the four updates makes half of the operations queries and half updates.
  arguments: "--test-time 180 -c 16 -t 4 --hide-histogram --print-percentiles 50,95,99,99.9 --key-prefix '' --key-minimum 125 --key-maximum 99999 --command 'FT.SEARCH idx \"(@update_date_ts:[-inf (1484298946] @update_date_ts:[(1399908937 +inf])=>[KNN 25 @vector $vec_param EF_RUNTIME 64 AS vector_score]\" TIMEOUT 90000 RETURN 1 vector_score SORTBY vector_score DESC DIALECT 2 LIMIT 0 25 params 2 vec_param ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????' --command-ratio 4 --command 'HSET __key__ update_date_ts 1400000000' --command-ratio 1 --command 'HSET __key__ update_date_ts 1420000000' --command-ratio 1 --command 'HSET __key__ update_date_ts 1450000000' --command-ratio 1 --command 'HSET __key__ update_date_ts 1480000000' --command-ratio 1"

# The latency percentiles memtier reports per command type: the p95 and p99 of the queries and of
# the updates, and the throughput of each (--print-percentiles on the client sets them).
exporter:
  redistimeseries:
    metrics:
      - "$.'ALL STATS'.'Ft.searchs'.'Percentile Latencies'.'p95.00'"
      - "$.'ALL STATS'.'Ft.searchs'.'Percentile Latencies'.'p99.00'"
      - "$.'ALL STATS'.'Ft.searchs'.'Ops/sec'"
      - "$.'ALL STATS'.'Hsets'.'Percentile Latencies'.'p95.00'"
      - "$.'ALL STATS'.'Hsets'.'Percentile Latencies'.'p99.00'"
      - "$.'ALL STATS'.'Hsets'.'Ops/sec'"
