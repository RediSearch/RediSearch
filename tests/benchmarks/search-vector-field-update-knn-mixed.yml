version: 0.5
name: "search-vector-field-update-knn-mixed"
description: "
             KNN queries alongside a fixed number of vector-only updates, over documents
             that carry text, numeric and vector fields (MOD-19327).

             Constant KNN queries run on the primary client while a bounded background
             client rewrites only the vector of every live document once. The primary
             client's report counts the queries; the updates are a known, fixed number
             (99875), so the total ops of the run is that number plus the queries, and the
             KPI is total ops : KNN queries.

             Every update must be able to trigger GC when the vector-only fast path is off
             (OPTIMIZE_PARTIAL_UPDATE false): each one then deletes and re-adds the vector,
             and 99875 of them are far above the fork GC clean threshold, so the GC runs
             during the 180s window at its regular interval. With the fast path on the
             vector is rewritten in place and there is nothing to collect. The comparison
             that shows it is this benchmark against itself with OPTIMIZE_PARTIAL_UPDATE off.

             Companion to search-vector-field-update (updates only) and
             search-vector-numeric-partial-update-knn-mixed (numeric-only updates).
             Specifically for this testcase:
                - Type (read/write/mixed): mixed
                - Query type: KNN with a numeric pre-filter
                - Query sample: '(@update_date_ts:[-inf (1484298946] @update_date_ts:[(1399908937 +inf])=>[KNN 25 @vector $vec_param EF_RUNTIME 64 AS vector_score]'
             "
metadata:
  component: "search"

timeout_seconds: 1800
setups:
  - oss-standalone
  - oss-standalone-threads-6

dbconfig:
  dataset_name: "arxiv-titles-384-angular-filters-m16-ef-128"
  dataset: "https://s3.amazonaws.com/benchmarks.redislabs/redisearch/internal.tasks/arxiv-titles-384-angular-filters-m16-ef-128/arxiv-titles-384-angular-filters-m16-ef-128-dump.rdb"
  dataset_load_timeout_secs: 1000
  check:
    keyspacelen: 100000

clientconfig:
  benchmark_type: "mixed"
  tool: memtier_benchmark
  arguments: "--test-time 180 -c 16 -t 4 --hide-histogram --command 'FT.SEARCH idx \"(@update_date_ts:[-inf (1484298946] @update_date_ts:[(1399908937 +inf])=>[KNN 25 @vector $vec_param EF_RUNTIME 64 AS vector_score]\" TIMEOUT 90000 RETURN 1 vector_score SORTBY vector_score DESC DIALECT 2 LIMIT 0 25 params 2 vec_param ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????'"

# The updates run as a bounded background client, so the primary client above measures
# queries only and its report carries no update traffic.
# Keys are bare integers, and [125, 99999] is the corpus' one gap-free run -- 99875 of
# its 100000 documents. Every write therefore lands on a document that already exists:
# a range with gaps would create new ones, and this benchmark is about updates only.
# Each write generates a fresh 384-dim FLOAT32 vector in Lua, as search-vector-field-update does.
# 99875 requests at 555/s span the ~180s the primary runs. They must finish within its
# --test-time: the runner waits for both clients and warns if the background one outlives it.
background_clientconfig:
  tool: memtier_benchmark
  arguments: "-c 1 -t 1 --requests 99875 --rate-limiting 555 --key-prefix '' --key-minimum 125 --key-maximum 99999 --command 'EVAL \"local now=redis.call([[TIME]]) math.randomseed(now[1]+now[2]+KEYS[1]) local v={} for i=1,384 do v[i]=struct.pack([[<f]],math.random()*2-1) end return redis.call([[HSET]],KEYS[1],[[vector]],table.concat(v))\" 1 __key__'"
