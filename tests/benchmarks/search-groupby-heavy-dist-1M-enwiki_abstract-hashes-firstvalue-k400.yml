name: "search-groupby-heavy-dist-1M-enwiki_abstract-hashes-firstvalue-k400"
description: >-
  This filtered 1M-document enwiki workload matches 53,071 rows and groups them by title
  into 26,585 groups, the largest of 10 rows, asking each for the url of its longest
  abstract. A FIRST_VALUE that runs on the shards ships one pick per group per shard that
  holds it (43,802 rows on four primaries) plus the sort value it won with; one that runs on
  the coordinator receives all 53,071 rows. The two move a similar amount of data, so this
  workload isolates the per-group reducer cost. Compare against the FIRST_VALUE baseline
  only; the COLLECT and COUNT_DISTINCT siblings share the filter but not the plan.

metadata:
  component: "search"
  query_type: "groupby-heavy-distributed-firstvalue"
  backend: "hash"
  window: "0-400"

timeout_seconds: 1800

setups:
  - oss-cluster-04-primaries

dbconfig:
  - dataset_name: "ftsb-1M-enwiki_abstract-hashes"
  - dataset_load_timeout_secs: 1800
  - init_commands:
    - '"FT.CREATE" "enwiki_abstract" "ON" "HASH" "SCHEMA" "title" "text" "SORTABLE" "url" "text" "SORTABLE" "abstract" "text" "SORTABLE"'
  - tool: ftsb_redisearch
  - parameters:
    - workers: 64
    - reporting-period: 1s
    - input: "https://s3.amazonaws.com/benchmarks.redislabs/redisearch/datasets/1M-enwiki_abstract-hashes/1M-enwiki_abstract-hashes.redisearch.commands.SETUP.csv"
  - check:
      keyspacelen: 1000000

clientconfig:
  benchmark_type: "read-only"
  tool: memtier_benchmark
  arguments: "--test-time 180 -c 1 -t 1 --hide-histogram --command 'FT.AGGREGATE enwiki_abstract @abstract:american|county|university|book|district LOAD 2 @title @url APPLY strlen(@abstract) AS len GROUPBY 1 @title REDUCE FIRST_VALUE 4 @url BY @len DESC AS longest_url LIMIT 0 400'"
