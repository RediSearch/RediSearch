version: 0.5
name: "search-vector-field-update"
description: "
             Update-only benchmark over documents that carry text, numeric and vector
             fields, rewriting only the vector (MOD-17750).

             When an update names only VECTOR fields, the engine rewrites the vector in
             place under the document's existing doc-id and skips the rest of the
             indexing: the text and numeric fields, which are unchanged, are not
             re-indexed. That saved work is the gain this benchmark is meant to show.
             The comparison that shows it is this benchmark against itself with
             OPTIMIZE_PARTIAL_UPDATE off, which re-indexes the whole document.

             Companion to search-vector-numeric-partial-update, which leaves the vector
             unchanged and rewrites the numeric field instead. Shares the corpus with the
             vecsim-arxiv-titles-* read benchmarks, so the vector index here is the same
             size and shape those measure.
             Specifically for this testcase:
                - Type (read/write/mixed): write
                - Query type: N/A
                - Query sample: N/A
             "
metadata:
  component: "search"

timeout_seconds: 1800
setups:
  - oss-standalone
  - oss-standalone-threads-6

dbconfig:
  dataset_name: "arxiv-titles-384-angular-filters-m16-ef-128"
  dataset: "https://s3.amazonaws.com/benchmarks.redislabs/redisearch/internal.tasks/arxiv-titles-384-angular-filters-m16-ef-128/arxiv-titles-384-angular-filters-m16-ef-128-dump.rdb"
  dataset_load_timeout_secs: 1000
  check:
    keyspacelen: 100000

clientconfig:
  benchmark_type: "write-only"
  tool: memtier_benchmark
  # Keys are bare integers, and [125, 99999] is the corpus' one gap-free run -- 99875 of
  # its 100000 documents. Every write therefore lands on a document that already exists:
  # a range with gaps would create new ones, and this benchmark is about updates only.
  # The vector is one of four fixed 384-dim FLOAT32 blobs, written as 1536 ASCII characters.
  # Random bytes would not do: most blobs then contain at least one NaN or inf float, which
  # poisons the distances. With every byte below 0x80 a float cannot have an all-ones
  # exponent, so each value is finite; the top byte of every float is '>' or '=' to keep
  # magnitudes near 1 so squared norms do not overflow. Four blobs rather than one so a write
  # usually replaces a document's vector with a different one.
