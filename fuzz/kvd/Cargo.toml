[package]
name = "kvd"
version = "0.0.1"
edition = "2024"
description = "A small RESP server with planted bugs, and its procfuzz model"
publish = false
license-file = "../../LICENSE.txt"

[[bin]]
name = "kvd"
path = "src/main.rs"

[[bin]]
name = "kvd-fuzz"
path = "src/bin/kvd-fuzz.rs"

[dependencies]
clap.workspace = true
env_logger.workspace = true
log.workspace = true
procfuzz = { workspace = true, features = ["cli"] }
procfuzz-redis.workspace = true
serde.workspace = true
