[package]
name = "redisearch-fuzz"
version = "0.0.1"
edition = "2024"
publish = false
license-file = "../LICENSE.txt"

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
nix = { version = "0.30", features = ["fs", "mman", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tempfile = "3"
