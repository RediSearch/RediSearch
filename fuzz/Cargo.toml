[workspace]
resolver = "3"
members = ["procfuzz", "procfuzz-redis", "redisearch"]
default-members = ["redisearch"]

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4"
memmap2 = "0.9"
nix = { version = "0.30", features = ["fs", "mman", "process", "signal"] }
procfuzz = { path = "procfuzz" }
procfuzz-redis = { path = "procfuzz-redis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
