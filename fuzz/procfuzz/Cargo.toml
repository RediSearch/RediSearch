[package]
name = "procfuzz"
version = "0.0.1"
edition = "2024"
description = "Building blocks for coverage-guided fuzzing of programs run against a process"
publish = false
license-file = "../../LICENSE.txt"

[features]
# The fuzzer's commands as a clap subcommand, for a target's own main.
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
libafl.workspace = true
libafl_bolts.workspace = true
log.workspace = true
memmap2.workspace = true
nix.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
