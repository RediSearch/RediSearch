<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
<title id="title">MOD-17473 local benchmark results</title>
<desc id="desc">POC versus master throughput and p99 latency percentage changes for aggregate and hybrid queries, plus cursor and memory summaries.</desc>
<rect width="1600" height="1240" fill="#0b1020"/>
<style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
